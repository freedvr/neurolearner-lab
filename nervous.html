<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nervous System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: the Mimage map is the stage (Manhattan = nervous system); outline and notes docked right; bottom sheet on phones. */
:root{
  color-scheme: dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0b0e14; --bg-2:#141a27; --panel:#11151e; --raise:#1a2030; --line:#283044;
  --fg:#eceef4; --muted:#a3abbc; --faint:#6e7689; --chalk:#f4d27a;
  --na:#ffb547; --k:#a58bff; --ca:#5fe0a3; --nt:#ff6fa5; --light:#7ad7ff; --hot:#ff7a59;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --panel-w:460px;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}

#stage{position:fixed;inset:0;background:radial-gradient(ellipse 75% 70% at 38% 42%,var(--bg-2) 0%,var(--bg) 72%)}
#stage canvas{display:block;touch-action:none;cursor:grab}
#stage canvas.hovering{cursor:pointer}

.brand{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:20px;z-index:5;pointer-events:none}
.home-link{pointer-events:auto;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.home-link:hover{color:var(--fg)}
.brand-sub{font-size:13px;font-weight:600;color:#ffd166;margin-top:2px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:2px 0 0}

/* scenario chips */
.chips{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);right:calc(var(--panel-w) + 16px);left:300px;z-index:5;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(17,21,30,.78);backdrop-filter:blur(6px);cursor:pointer;font-size:13.5px;white-space:nowrap}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--c,var(--chalk));background:color-mix(in srgb,var(--c,var(--chalk)) 24%,rgba(17,21,30,.9));font-weight:700}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--chalk))}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(17,21,30,.78);backdrop-filter:blur(6px)}
.seg button{border:0;background:none;padding:7px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--chalk);color:#16130a;font-weight:700}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 106px);left:20px;max-width:340px;z-index:5;background:rgba(17,21,30,.92);border:1px solid var(--line);border-left:3px solid var(--c,var(--chalk));border-radius:0 10px 10px 0;padding:10px 12px;font-size:13.5px;color:var(--fg);backdrop-filter:blur(6px)}
.toast b{display:block;font-family:var(--f-display);font-size:15px;margin-bottom:2px}
.toast .term{margin-top:4px;display:inline-block}

/* lab instruments */
.lab{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:5;width:min(420px,calc(100vw - var(--panel-w) - 40px));background:rgba(15,19,28,.9);border:1px solid var(--line);border-radius:14px;padding:14px 16px;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:10px}
.lab-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.readout{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.readout small{font-size:15px;color:var(--muted);font-weight:600;margin-left:3px}
.phase{font-size:13px;color:var(--muted);min-height:20px}
.phase b{color:var(--fg)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.slider-row{display:flex;align-items:center;gap:10px}
input[type=range]{flex:1;accent-color:var(--chalk);height:28px;margin:0}
.btn{padding:9px 15px;border-radius:9px;border:1px solid var(--line);background:var(--raise);cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--chalk);color:#16130a;border-color:var(--chalk)}
.btn.small{padding:6px 11px;font-size:13px}
.states{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.state{padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--faint)}
.state.on{color:#16130a;font-weight:700}
.state.closed.on{background:#8ea3c4}.state.open.on{background:var(--na)}.state.inact.on{background:#ff8f8f}
.state.k.on{background:var(--k)}
#trace{width:100%;height:120px;display:block;border-radius:8px;background:#0b0e14}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}

.mimage{position:fixed;right:calc(var(--panel-w) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:5;width:300px;background:rgba(15,19,28,.9);border:1px solid var(--line);border-radius:14px;padding:12px 14px;backdrop-filter:blur(8px)}
.mimage canvas{width:100%;height:auto;display:block;border-radius:8px;margin-top:6px}
.mimage .cap{font-size:12.5px;color:var(--muted);margin-top:6px}
.mimage h4{margin:2px 0 0;font-family:var(--f-display);font-size:16px}

/* labels on the neuron */
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.plabel{width:max-content;position:absolute;left:0;top:0;transform:translate(-50%,-140%);font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:6px;background:rgba(11,14,20,.85);border:1px solid var(--line);white-space:nowrap;pointer-events:none;transition:opacity .2s}
.plabel.hot{border-color:var(--chalk);color:var(--chalk)}
.plabel.ion{font-weight:400;font-family:var(--f-mono);font-size:11.5px}

/* panel */
#panel{box-sizing:border-box;position:fixed;top:0;right:0;bottom:0;width:var(--panel-w);background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;z-index:6;padding:calc(env(safe-area-inset-top,0px) + 24px) 26px calc(env(safe-area-inset-bottom,0px) + 26px);display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
#panel h2{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.015em;margin:4px 0 0;text-wrap:balance}
#panel p{margin:0;color:var(--fg);max-width:62ch}
#panel .lead{color:var(--muted)}
.topic-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.topic-btn{width:100%;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--raise);cursor:pointer}
.topic-btn:hover{border-color:var(--c)}
.topic-btn .k{font-family:var(--f-mono);font-size:11px;color:var(--c);letter-spacing:.06em}
.topic-btn b{font-family:var(--f-display);font-size:17px}
.back{align-self:flex-start;background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:14px}
.back:hover{color:var(--fg)}
.topic-head .eyebrow{color:var(--c)}
.blist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.blist li::marker{color:var(--c)}
.figure{margin:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;display:flex;flex-direction:column;gap:8px}
.figure img{display:block;width:100%;border-radius:7px;cursor:zoom-in;background:#fff}
.figure.narrow img{width:auto;max-height:300px;margin:0 auto}
.figure figcaption{font-size:12.5px;color:var(--muted)}
.mn{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mn-title{padding:8px 12px;background:color-mix(in srgb,var(--c) 18%,var(--raise));font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.mn-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.mn-row .L{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;color:var(--c);text-align:center}
.mn-row b{font-family:var(--f-display);font-size:16px}
.mn-row .mem{display:block;color:var(--chalk);font-weight:700;font-size:14px}
.mn-row .det{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.pairs{display:grid;grid-template-columns:minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pairs div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.pairs div:first-child{border-top:0}
.see3d{display:inline-block;margin-top:4px;background:none;border:0;padding:0;color:var(--c,#f4d27a);font:inherit;font-weight:700;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.pairs dt{color:var(--muted);margin:0}.pairs dd{margin:0}
.tries{display:flex;flex-wrap:wrap;gap:8px}
.try{border:1px dashed var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);color:var(--fg);padding:8px 13px;border-radius:9px;cursor:pointer;font-weight:700;font-size:13.5px}
.try:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}
.parts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.part{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--raise)}
.part b{display:block;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.part:hover,.part:focus-visible{border-color:var(--c)}
.part[aria-pressed="true"]{border-color:var(--chalk);background:color-mix(in srgb,var(--chalk) 14%,var(--raise))}
.case{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;cursor:pointer;border-left:3px solid var(--c);padding:10px 12px;background:rgba(0,0,0,.22);border-radius:0 8px 8px 0;font-size:14px}
.case:hover,.case:focus-visible{background:color-mix(in srgb,var(--c) 14%,rgba(0,0,0,.2))}
.case .eyebrow{color:var(--c)}
.go-card{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--fg);border:1px solid var(--c);border-radius:10px;padding:12px 14px;background:color-mix(in srgb,var(--c) 14%,var(--raise))}
.go-card b{font-family:var(--f-display);font-size:17px}
.go-card:hover{background:color-mix(in srgb,var(--c) 24%,var(--raise))}
.case-go{font-size:12.5px;color:var(--c);font-weight:700;margin-top:2px}
.qa{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.qa .q{font-weight:700}
.qa .a{color:var(--muted);font-size:14px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px}
.note{font-size:12.5px;color:var(--faint)}
.term{all:unset;cursor:pointer;font-weight:700;border-bottom:2px solid var(--c,var(--chalk));padding:0 1px;border-radius:2px;background:color-mix(in srgb,var(--c,var(--chalk)) 14%,transparent)}
.term:hover,.term:focus-visible{background:color-mix(in srgb,var(--c,var(--chalk)) 30%,transparent)}

/* cards */
#card[hidden]{display:none}
#card{position:fixed;inset:0;right:var(--panel-w);z-index:8;display:grid;place-items:center;padding:24px;background:rgba(8,10,14,.55);backdrop-filter:blur(3px)}
.card-sheet{width:min(640px,100%);max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);overscroll-behavior:contain}
.card-top{position:sticky;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 12px;background:var(--panel);border-bottom:1px solid var(--line);z-index:1}
.card-top .eyebrow{color:var(--c)}
.card-top h3{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;margin:3px 0 0;text-wrap:balance}
.close{flex:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--raise);cursor:pointer;font-size:20px;line-height:1}
.card-body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px}
.cfig{margin:0;border-radius:10px;overflow:hidden;border:1px solid var(--line)}.cfig svg{display:block;width:100%;height:auto}.cfig figcaption{font-size:13px;color:var(--muted);padding:8px 12px}
.card-body p{margin:0;max-width:62ch}
.refs{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.refs summary{cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.refs ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
#lightbox[hidden]{display:none}
#lightbox{position:fixed;inset:0;background:rgba(5,7,10,.94);z-index:12;display:grid;place-items:center;padding:24px;cursor:zoom-out}
#lightbox img{max-width:100%;max-height:100%;border-radius:10px;object-fit:contain;background:#fff}
#loading{position:fixed;left:0;right:var(--panel-w);top:46%;text-align:center;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);z-index:1}

.plabel.big{font-size:15px;padding:4px 11px}
.plabel .eyebrow{font-size:10px}
.scene-hud{display:none}
#panel > *{flex-shrink:0}
body[data-scene="bump"] .lab-only, body[data-scene="membrane"] .lab-only{display:none!important}
body[data-scene="membrane"] #memHud, body[data-scene="bump"] #bumpHud{display:flex}
.hud-row{display:flex;flex-wrap:wrap;gap:8px}
.hud-btn{padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--raise);cursor:pointer;font-weight:700;font-size:13.5px}
.hud-btn[aria-pressed="true"]{background:var(--c,var(--chalk));color:#16130a;border-color:var(--c,var(--chalk))}
.hud-btn:hover{border-color:var(--muted)}
.bump-pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bump-pick button{padding:8px 4px;border-radius:9px;border:1px solid var(--line);background:var(--raise);cursor:pointer;text-align:center}
.bump-pick b{display:block;font-family:var(--f-display);font-size:24px;line-height:1;color:var(--c)}
.bump-pick span{font-size:11.5px;color:var(--muted)}
.bump-pick button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--raise))}
.mn-pick{all:unset;box-sizing:border-box;cursor:pointer;width:100%}
.mn-pick:hover .mn-row,.mn-pick:focus-visible .mn-row{background:color-mix(in srgb,var(--c) 10%,transparent)}
.mn-pick[aria-pressed="true"] .mn-row{background:color-mix(in srgb,var(--c) 18%,transparent)}
.mn-hint{font-size:12px;color:var(--faint);padding:6px 12px;border-top:1px solid var(--line)}
@media (max-width:1180px){ .mimage{display:none} }
@media (max-width:820px){
  :root{--panel-w:0px}
  #panel{width:auto;top:auto;left:0;height:46%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 20px)}
  #panel h2{font-size:24px}
  .brand h1{font-size:17px}
  .chips{left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 58px);flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-bottom:4px}
  .toast{display:none}
  .lab{left:10px;right:10px;width:auto;bottom:calc(46% + 8px);padding:10px 12px;gap:7px}
  #trace,.states{display:none}
  .phase{font-size:12.5px}
  .readout{font-size:26px}
  .legend{display:none}
  #card{right:0;padding:0} .card-sheet{border-radius:0;height:100%;max-height:none}
  .pairs div{grid-template-columns:110px minmax(0,1fr)}
  .parts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hud{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:5;width:min(520px,calc(100vw - var(--panel-w) - 40px));background:rgba(15,19,28,.92);border:1px solid var(--line);border-radius:14px;padding:12px 14px;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:8px}
#hudCanvas{width:100%;height:auto;display:block;border-radius:8px}
#hudText{font-size:13.5px;color:var(--muted);min-height:40px}
#hudText b{color:var(--fg)}
.plabel{width:max-content}
.plabel.elec{font-family:var(--f-mono);font-size:10.5px;padding:1px 5px;font-weight:500;background:rgba(11,14,20,.75)}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.mbtn{width:100%;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;padding:10px 13px;border-radius:10px;border:1px solid var(--line);background:var(--raise);cursor:pointer}
.mbtn:hover,.mbtn:focus-visible{border-color:var(--c)}
.mbtn .mn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#0b0e14;font-family:var(--f-display);font-weight:800;font-size:16px}
.mbtn b{display:block;font-family:var(--f-display);font-size:16.5px}
.mbtn span span{display:block;font-size:12.5px;color:var(--muted)}
.rw{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;white-space:nowrap}
.rw::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--k)}
.rwkey{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.chart svg{width:100%;height:auto;display:block}
.chart .pt{cursor:pointer}
.chart .pt:hover text,.chart .pt:focus text{fill:var(--chalk)}
.chart{background:var(--bg)}
.long{color:var(--muted);font-size:14px;margin-top:2px}
.mem-line{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--chalk);line-height:1.3}
.specs dt{color:var(--muted)}
.cases{display:flex;flex-direction:column;gap:8px}
.try[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 30%,transparent);border-style:solid}
.quiz{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--raise)}
.quiz .q{font-weight:700;margin:0}
.qopts{display:flex;flex-wrap:wrap;gap:6px}
.qopt{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700;font-size:13px}
.qopt:hover:not(:disabled){border-color:var(--chalk)}
.qopt[aria-pressed="true"]{background:var(--chalk);color:#16130a}
.qfb{margin:0;font-size:14px}
.qfb.ok{color:#5fe0a3}.qfb.bad{color:#ffb0a0}
.fm{border:1px solid var(--c);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--c) 8%,var(--raise))}
.fm-steps{display:flex;flex-direction:column;gap:6px}
.fms{padding:8px 10px;border-radius:8px;border:1px solid var(--line);opacity:.45;font-size:13.5px}
.fms b{display:block}
.fms.on{opacity:1;border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.fms.done{opacity:.75}
#panel a{color:var(--chalk)}
.qa{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.qa .q{font-weight:700}.qa .a{color:var(--muted);font-size:14px}
@media (max-width:820px){ .hud{left:10px;right:10px;width:auto;bottom:calc(52% + 8px);padding:8px 10px} #hudText{font-size:12.5px;min-height:0} #hudCanvas{max-height:90px;object-fit:contain} }

#stage{background:radial-gradient(ellipse 80% 70% at 40% 35%,#2a1d4a 0%,#140f24 60%,#0b0912 100%)}
.otree{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.otree li{margin-left:calc(var(--d)*18px);position:relative}
.otree li::before{content:"";position:absolute;left:-11px;top:-6px;bottom:50%;border-left:1px solid var(--line);border-bottom:1px solid var(--line);width:9px;display:var(--tree,block)}
.otree li[style*="--d:0"]::before{display:none}
.onode{width:100%;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;text-align:left;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--raise);cursor:pointer}
.onode:hover,.onode:focus-visible{border-color:var(--c)}
.odot{width:11px;height:11px;border-radius:50%;background:var(--c)}
.onode b{display:block;font-size:14.5px;font-family:var(--f-display)}
.onode span span{display:block;font-size:12.5px;color:var(--chalk)}
.kids{display:flex;flex-direction:column;gap:7px}
.kids .mbtn .mn{width:14px;height:14px}
.figure.narrow img{max-height:260px;background:#f4ead2}
.figure img{background:#f4ead2}
.plabel b{color:var(--chalk)}
.plabel.big{font-size:14px}
#hudCanvas[hidden]{display:none}
#bodyCard{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(var(--panel-w) + 14px);z-index:5;width:132px;background:rgba(15,19,28,.88);border:1px solid var(--line);border-radius:14px;padding:10px 10px 8px;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:6px}
#bodyCard svg{width:100%;height:auto;display:block}
#bodyCard .key{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);line-height:1.3}
#bodyCard .key i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
#bodySvg .cns,#bodySvg .som,#bodySvg .aut,#bodySvg .brainS,#bodySvg .cord,#bodySvg .cbl,#bodySvg .vagus,#bodySvg .chain,#bodySvg .heart,#bodySvg .gut{transition:opacity .4s,filter .4s}
#bodySvg .hit path,#bodySvg .hit ellipse{stroke:transparent;stroke-width:9;fill:none;pointer-events:stroke;cursor:pointer}
#bodySvg .hit ellipse{fill:transparent;pointer-events:all}
.dim{opacity:.16}.mid{opacity:.45}
.glowY{filter:drop-shadow(0 0 3px #ffd166) drop-shadow(0 0 6px #ffd166)}
.glowB{filter:drop-shadow(0 0 2px #5ab8ff) drop-shadow(0 0 5px #5ab8ff)}
.glowG{filter:drop-shadow(0 0 3px #5fe0a3)}.glowR{filter:drop-shadow(0 0 3px #ff7a59)}.glowP{filter:drop-shadow(0 0 3px #ff8fb0)}
.flowOut .nv,.flowOut.vagus,.flowOut .vagus{stroke-dasharray:5 5;animation:flow .8s linear infinite}
.flowIn .nv{stroke-dasharray:5 5;animation:flow .8s linear infinite reverse}
@keyframes flow{to{stroke-dashoffset:-10}}
@media (max-height:700px) and (min-width:821px){ #bodyCard{width:104px} }
@media (max-width:820px){ #bodyCard{width:96px;padding:6px;top:calc(env(safe-area-inset-top,0px) + 56px);right:10px} #bodyCard .key,#bodyCard .eyebrow{display:none} }
#bodySvg .skin{fill:#2a3142;stroke:#4a5470;stroke-width:1}
#bodySvg .cord{stroke:#ffd166;stroke-width:4;stroke-linecap:round;fill:none}.brainS,.cbl{fill:#ffd166}
.nv{stroke:#5ab8ff;stroke-width:1.4;fill:none;stroke-linecap:round}
.vagus{stroke:#5fe0a3;stroke-width:1.6;fill:none}.chain circle{fill:#ff7a59}
.org{fill:none;stroke:#ff8fb0;stroke-width:1.2;opacity:.7}

.parts .part b{font-family:var(--f-display);font-size:15px}

<script>
/* ============ Nervous system outline (from Professor Freed's Mimage) ============ */
const C = { cns:'#5fd08a', brain:'#7fe0a0', cord:'#e9dcc0', pns:'#b58bff', som:'#8fb4ff', aut:'#9fb0c4', sym:'#ff7a59', par:'#5fe0a3', ent:'#ff8fb0' };
const NODES = [
  { id:'ns', depth:0, title:'The nervous system', mn:'NYC = Nervous system', color:'#f4d27a', img:'img/nervous/mimage.jpg',
    lead:'Your nervous system has two big parts. The central nervous system (CNS) is the brain and spinal cord. The peripheral nervous system (PNS) is every nerve outside them. On this map, Manhattan’s Central Park is the CNS and the purple sea around it is the PNS.',
    points:[
      'The CNS (brain and spinal cord) takes in information, makes decisions and sends out commands.',
      'The PNS carries messages between the CNS and the rest of your body: 12 pairs of cranial nerves and 31 pairs of spinal nerves.',
      'The PNS splits into the somatic system (movement and senses you’re aware of) and the autonomic system (organs that run without you thinking about them).'] },

  { id:'cns', parent:'ns', depth:1, title:'CNS: central nervous system', short:'CNS', mn:'Central Park = Central nervous system', color:C.cns, img:'img/nervous/park.jpg',
    lead:'The brain and spinal cord. Think of the trees in Central Park: the canopy is the brain and the trunk is the spinal cord.',
    demos:[['Turn the big tree into a brain and spinal cord','cnsShow']],
    points:[
      'The CNS is the command center: it combines incoming information, decides and sends out commands.',
      'It’s heavily protected: bone (skull and vertebrae), three layers of membranes (the meninges), cushioning cerebrospinal fluid, and the blood–brain barrier.',
      'The human brain has about 86 billion neurons ([[neurons86|how we know]]).',
      'Damage to the CNS heals poorly; cut nerves in the PNS can regrow. See [[regen|why]].'],
    cases:[['sci','Spinal cord injury: why the level matters']] },

  { id:'brain', parent:'cns', depth:2, title:'Brain', mn:'The tree canopy: four lobes', color:C.brain,
    lead:'The canopy of the big tree is the brain. Each hemisphere has four lobes, and each lobe has its own job.',
    demos:[['Frontal','lobe0'],['Parietal','lobe1'],['Temporal','lobe2'],['Occipital','lobe3']],
    lobes:[['Frontal lobe','Planning, decisions, personality and movement. The motor cortex (motor homunculus) is at its back edge.','#ff8f6b'],
           ['Parietal lobe','Touch and body sense (the sensory homunculus), plus knowing where things are in space.','#ffd166'],
           ['Temporal lobe','Hearing, understanding language, and memory (the hippocampus sits inside).','#5fe0a3'],
           ['Occipital lobe','Vision. Signals from your eyes arrive at the very back of the brain.','#a58bff']],
    points:[
      'Tap a lobe button to light it up on the tree canopy.',
      'You’ve already learned each lobe’s five parts in the Neuroanatomy unit.'],
    go:['neuroanatomy.html','Open Neuroanatomy →','Walk through every lobe in 3D with its Mimage.'] },

  { id:'cord', parent:'cns', depth:2, title:'Spinal cord', mn:'The tree trunk', color:C.cord, img:null,
    lead:'The trunk of the tree is the spinal cord: the main cable between your brain and your body. Spinal nerves branch off it in pairs.',
    demos:[['Run a reflex (touch a hot stove)','reflex'],['Show the 31 pairs of spinal nerves','pairs']],
    points:[
      'About 45 cm long in adults. 31 pairs of spinal nerves leave it: 8 cervical, 12 thoracic, 5 lumbar, 5 sacral and 1 coccygeal.',
      'In a cross-section, the gray matter (cell bodies) is a butterfly shape in the middle and the white matter (axons) is on the outside. That’s the opposite of the brain’s cortex, where gray matter is on the outside.',
      'Each spinal nerve joins the cord by two roots: the <b>dorsal</b> root at the back, which brings sensory information in, and the <b>ventral</b> root at the front, which sends motor commands out.',
      'Reflexes such as pulling your hand off a hot stove are handled right in the spinal cord. Your hand moves before the pain reaches your brain.'],
    cases:[['sci','Spinal cord injury: why the level matters'],['magendie','The Bell–Magendie law']] },

  { id:'dorsal', parent:'cord', depth:3, title:'Dorsal root', mn:'Dorsal = Delivers sensory information', color:'#7ad7ff',
    lead:'The dorsal (back) root delivers sensory information into the spinal cord: touch, pain, temperature and body position.',
    demos:[['Deliver a touch signal in','dorsalGo']],
    points:[
      'Sensory neurons are afferent: they carry signals toward the CNS.',
      'Their cell bodies sit in a bump on the dorsal root called the [[drg|dorsal root ganglion]].',
      'If a dorsal root is cut, that patch of skin goes numb, but the muscles still move.',
      'Bonus mnemonic: <b>SAME DAVE</b>. Sensory = Afferent, Motor = Efferent; Dorsal = Afferent, Ventral = Efferent.'] },

  { id:'ventral', parent:'cord', depth:3, title:'Ventral root', mn:'Ventral = Vrooms (motor commands out)', color:'#ffb547',
    lead:'The ventral (front) root is where motor commands vroom out of the spinal cord to your muscles.',
    demos:[['Vroom a motor command out','ventralGo']],
    points:[
      'Motor neurons are efferent: they carry signals away from the CNS.',
      'Their cell bodies sit in the ventral horn of the gray matter, and their axons leave through the ventral root.',
      'If a ventral root is cut, those muscles are paralyzed, but you can still feel the skin.',
      'Polio damages motor neurons in the ventral horn. That’s why it causes paralysis, not numbness.'] },

  { id:'pns', parent:'ns', depth:1, title:'PNS: peripheral nervous system', short:'PNS', mn:'Purple Sea = Peripheral nervous system', color:C.pns, img:'img/nervous/sea.jpg',
    lead:'Every nerve outside the brain and spinal cord: the purple sea that surrounds Central Park and reaches every part of the map.',
    demos:[['Light up the nerves in the sea','pnsGlow']],
    points:[
      'On a body diagram, the PNS is all the <b>blue</b>: the nerves branching out to your arms, chest, legs and organs. That’s the Purple Sea. The <b>yellow</b> brain and spinal cord are Central Park.',
      'Includes the 12 pairs of cranial nerves (from the brain), the 31 pairs of spinal nerves (from the cord), and clusters of nerve cell bodies called ganglia.',
      'It isn’t protected by bone or the blood–brain barrier, so it’s more exposed to injury and toxins.',
      'Unlike the CNS, cut peripheral nerves can regrow, about 1 mm a day, guided by Schwann cells ([[regen|why]]).',
      'Two divisions: the <b>somatic</b> system (Samurai) and the <b>autonomic</b> system (Atomic Sub).'] },

  { id:'somatic', parent:'pns', depth:2, title:'Somatic nervous system', mn:'Samurai = Somatic (movement & senses)', color:C.som, img:'img/nervous/samurai.jpg',
    lead:'The part you control and feel: voluntary movement of your skeletal muscles, and the senses coming in from your skin, muscles and joints.',
    demos:[['Swing the sword (motion)','motion'],['Feel the water (touch)','touch']],
    points:[
      'Motion: commands go out from the brain, down the spinal cord, and out to skeletal muscles.',
      'Touch: signals come in from the body, up the spinal cord, to the brain.',
      'At the muscle, motor neurons release acetylcholine (ACh) at the neuromuscular junction. Block those receptors and the samurai can’t swing ([[curare|curare]]).'],
    cases:[['homunculus','The homunculi: your body map in the brain'],['curare','Curare: freezing the samurai']] },

  { id:'motion', parent:'somatic', depth:3, title:'Motion', mn:'Think frontal lobe: the Athlete is where movement signals start', color:'#ff8f6b',
    lead:'Movement starts in the primary motor cortex at the back of the frontal lobe, the motor homunculus.',
    demos:[['Swing the sword','motion']],
    route:['Frontal lobe (motor cortex)','Down the spinal cord','Out the ventral root','Muscle contracts'],
    points:[
      'The motor cortex has a map of your body, the [[homunculus|motor homunculus]]: hands, lips and tongue get the most space because they need the finest control.',
      'Commands travel down the corticospinal tract, cross to the other side, and leave the cord through the ventral root (Vrooms).',
      'The left motor cortex moves the right side of your body.'] },

  { id:'touch', parent:'somatic', depth:3, title:'Touch', mn:'Think PITT: parietal lobe, where signals from the body arrive', color:'#ffd166',
    lead:'Touch signals travel from receptors in your skin to the primary somatosensory cortex at the front of the parietal lobe, the sensory homunculus.',
    demos:[['Feel the water','touch']],
    route:['Receptors in the skin','In the dorsal root','Up the spinal cord','Parietal lobe (sensory homunculus)'],
    points:[
      'Signals enter through the dorsal root (Delivers), climb the spinal cord, stop at the thalamus, then reach the parietal lobe.',
      'The [[homunculus|sensory homunculus]] gives fingertips and lips the most space, which is why they’re so sensitive.',
      'The right side of your body is felt by the left parietal lobe.'] },

  { id:'autonomic', parent:'pns', depth:2, title:'Autonomic nervous system', mn:'Atomic Sub = Autonomic (subconscious)', color:C.aut, img:'img/nervous/sub.jpg',
    lead:'Runs automatically, below your awareness: heart rate, breathing, pupils, sweating, digestion. Like a submarine running silently under the surface.',
    demos:[['Fight or flight','sym'],['Rest and digest','par']],
    dash:true,
    points:[
      'It controls heart muscle, smooth muscle (blood vessels, airways, gut) and glands.',
      'The hypothalamus is its main commander in the brain.',
      'Three branches, front to back of the sub: <b>sympathetic</b> (fight or flight), <b>parasympathetic</b> (rest and digest) and <b>enteric</b> (the gut’s own nervous system).',
      'Most organs get both sympathetic and parasympathetic nerves, which push in opposite directions, like a gas pedal and a brake.'] },

  { id:'sym', parent:'autonomic', depth:3, title:'Sympathetic', mn:'Front of the sub: Rambo Simpson = Sympathetic (fight or flight)', color:C.sym, img:'img/nervous/front.jpg',
    lead:'Fight or flight. Your body gears up for action: heart pounding, pupils wide, airways open, digestion on hold.',
    demos:[['Fight or flight!','sym']], dash:true,
    points:[
      'Speeds the heart, dilates the pupils, opens the airways, releases stored glucose, and slows digestion and saliva (dry mouth before a speech).',
      'The adrenal glands release [[adrenaline|adrenaline (epinephrine)]] into the blood, so the whole body gets the message.',
      'Its nerves leave the thoracic and lumbar spinal cord, and most use norepinephrine at the target organ.',
      'Walter Cannon named the [[cannon|fight-or-flight response]] in 1915.'] },

  { id:'par', parent:'autonomic', depth:3, title:'Parasympathetic', mn:'Middle of the sub: Parachuting Simpson = Parasympathetic (rest and digest)', color:C.par, img:'img/nervous/middle.jpg',
    lead:'Rest and digest. Your body slows down and recharges: calm heart, saliva flowing, stomach and intestines at work.',
    demos:[['Rest and digest','par'],['Send a signal down the vagus nerve','vagus']], dash:true,
    points:[
      'Slows the heart, constricts the pupils, increases saliva and digestion, and helps the bladder empty.',
      'Its nerves leave the brainstem (cranial nerves) and the sacral spinal cord, and they use acetylcholine at the target organ.',
      'Bonus: the [[vagus|vagus nerve (CN X)]] carries most of the parasympathetic signals. It wanders from the brainstem to your heart, lungs and gut.',
      'Too much vagus at once can make you faint ([[vasovagal|vasovagal fainting]]).'] },

  { id:'ent', parent:'autonomic', depth:3, title:'Enteric', mn:'Back of the sub: pile of guts = Enteric (gut system)', color:C.ent, img:'img/nervous/back.jpg',
    lead:'The nervous system inside your gut wall. It can run digestion on its own, which is why it’s called the “second brain.”',
    demos:[['Watch the gut work','gut'],['Send a gut feeling to the brain','gutBrain']],
    points:[
      'Hundreds of millions of neurons line your digestive tract, more than in your spinal cord ([[secondbrain|the second brain]]).',
      'It squeezes food along (peristalsis) and controls digestive secretions, even if its connection to the brain is cut.',
      'Mind–gut connection: it talks with the brain through the vagus nerve. Most vagus fibers carry messages up from the gut, not down.',
      'Most of your body’s serotonin is made in the gut, not the brain ([[serotonin|serotonin in the gut]]). “Butterflies in your stomach” are your gut and brain talking.'] }
];
const NODE = Object.fromEntries(NODES.map(n => [n.id, n]));
const ORDER = NODES.map(n => n.id);

const REFS = {
  kandel:'Kandel, E. R., Koester, J. D., Mack, S. H., & Siegelbaum, S. A. (2021). Principles of Neural Science (6th ed.). McGraw Hill.',
  purves:'Purves, D., et al. (2018). Neuroscience (6th ed.). Oxford University Press.',
  bear:'Bear, M. F., Connors, B. W., & Paradiso, M. A. (2016). Neuroscience: Exploring the Brain (4th ed.). Wolters Kluwer.',
  azevedo:'Azevedo, F. A. C., et al. (2009). Equal numbers of neuronal and nonneuronal cells make the human brain an isometrically scaled-up primate brain. Journal of Comparative Neurology, 513(5), 532–541.',
  penfield:'Penfield, W., & Boldrey, E. (1937). Somatic motor and sensory representation in the cerebral cortex of man as studied by electrical stimulation. Brain, 60(4), 389–443.',
  cannon:'Cannon, W. B. (1915). Bodily Changes in Pain, Hunger, Fear and Rage. D. Appleton.',
  furness:'Furness, J. B. (2012). The enteric nervous system and neurogastroenterology. Nature Reviews Gastroenterology & Hepatology, 9(5), 286–294.',
  gershon:'Gershon, M. D. (1998). The Second Brain. HarperCollins.',
  yano:'Yano, J. M., et al. (2015). Indigenous bacteria from the gut microbiota regulate host serotonin biosynthesis. Cell, 161(2), 264–276.',
  breit:'Breit, S., Kupferberg, A., Rogler, G., & Hasler, G. (2018). Vagus nerve as modulator of the brain–gut axis in psychiatric and inflammatory disorders. Frontiers in Psychiatry, 9, 44.',
  magendie:'Magendie, F. (1822). Expériences sur les fonctions des racines des nerfs rachidiens. Journal de physiologie expérimentale et pathologique, 2, 276–279.',
  syncope:'Brignole, M., et al. (2018). 2018 ESC Guidelines for the diagnosis and management of syncope. European Heart Journal, 39(21), 1883–1948.',
  sci:'Ahuja, C. S., et al. (2017). Traumatic spinal cord injury. Nature Reviews Disease Primers, 3, 17018.',
  bowman:'Bowman, W. C. (2006). Neuromuscular block. British Journal of Pharmacology, 147(S1), S277–S286.'

const CARDS = {
  neurons86:{title:'86 billion neurons', kicker:'How we know', body:['For years textbooks said 100 billion. In 2009, Suzana Herculano-Houzel’s lab dissolved brains into a “soup” of cell nuclei and counted them: about 86 billion neurons, and roughly as many non-neuron cells.','Most of those neurons, about 69 billion, are in the cerebellum.'], refs:['azevedo']},
  regen:{title:'Why the PNS heals and the CNS doesn’t', kicker:'Repair', body:['When a peripheral nerve is cut, Schwann cells clear the debris and line up into tunnels that guide the regrowing axon, about 1 mm a day.','In the CNS, the support cells (oligodendrocytes and astrocytes) do the opposite: they release growth-blocking molecules and form a glial scar. That’s why spinal cord injuries are usually permanent.'], refs:['kandel','purves']},
  sci:{title:'Spinal cord injury: why the level matters', kicker:'Case file', body:['Everything below an injury loses its connection to the brain, so the higher the injury, the more of the body is affected.','An injury in the neck (cervical) can affect both arms and legs (quadriplegia/tetraplegia); very high injuries can affect breathing. An injury lower down, in the thoracic or lumbar cord, usually affects the legs (paraplegia).','Reflexes below the injury can still work, because the reflex circuit lives in the cord itself.'], refs:['sci']},
  magendie:{title:'The Bell–Magendie law', kicker:'Classic discovery', body:['In the early 1800s, Charles Bell and François Magendie showed that the spinal roots have different jobs.','Magendie (1822) cut dorsal roots in puppies: the leg still moved but lost feeling. Cutting ventral roots caused paralysis while feeling remained.','Rule: dorsal roots are sensory (Delivers), ventral roots are motor (Vrooms).'], refs:['magendie','kandel']},
  drg:{title:'Dorsal root ganglion', kicker:'Where sensory cell bodies live', body:['A ganglion is a cluster of neuron cell bodies outside the CNS.','Sensory neurons are unusual: their cell body sits off to the side in the dorsal root ganglion, with one long branch reaching out to the skin and another reaching into the spinal cord.'], refs:['purves']},
  homunculus:{title:'The homunculi', kicker:'Your body map in the brain', body:['Wilder Penfield stimulated the brains of awake patients during surgery and mapped which spot moved or felt which body part.','The motor homunculus sits in the frontal lobe (motion); the sensory homunculus sits just behind it in the parietal lobe (touch).','Body parts get space based on how precise they are, not how big: the hands, lips and tongue are huge.'], refs:['penfield']},
  curare:{title:'Curare: freezing the samurai', kicker:'Case file', body:['Curare is a plant poison some South American hunters put on darts. It blocks acetylcholine receptors at the neuromuscular junction.','The motor command arrives, but the muscle can’t hear it: the animal is paralyzed. Breathing muscles stop too.','Drugs based on curare are used during surgery to relax muscles, with a machine breathing for the patient.'], refs:['bowman']},
  adrenaline:{title:'Adrenaline (epinephrine)', kicker:'Fight or flight in the blood', body:['The sympathetic system signals the adrenal glands (on top of the kidneys) to release adrenaline into the bloodstream.','That spreads the fight-or-flight message to the whole body within seconds, and it lingers, which is why your heart keeps pounding after a scare.'], refs:['purves']},
  cannon:{title:'Fight or flight', kicker:'Walter Cannon, 1915', body:['Physiologist Walter Cannon described how fear and rage trigger the same bodily changes: a racing heart, faster breathing, sugar released into the blood and digestion on hold.','The point: get the body ready to fight or run.'], refs:['cannon']},
  vagus:{title:'The vagus nerve (CN X)', kicker:'The wanderer', body:['“Vagus” is Latin for wandering. Cranial nerve X leaves the brainstem and wanders down to the heart, lungs and most of the gut.','It carries most of the parasympathetic signals that slow the heart and turn on digestion.','It’s a two-way road: most of its fibers carry information up from the organs to the brain.'], refs:['breit','kandel']},
  vasovagal:{title:'Fainting at the sight of blood', kicker:'Vasovagal syncope', body:['In some people, a trigger such as blood, a needle or standing for a long time causes a sudden rush of vagus (parasympathetic) activity.','The heart slows and blood vessels relax, blood pressure drops, the brain briefly gets too little blood, and the person faints. Lying down usually brings them right back.'], refs:['syncope']},
  secondbrain:{title:'The second brain', kicker:'Enteric nervous system', body:['The gut wall holds two layers of neuron networks (the myenteric and submucosal plexuses), roughly 200–600 million neurons in humans.','It can run peristalsis and secretions on its own, even when cut off from the brain. Michael Gershon called it “the second brain.”'], refs:['furness','gershon']},
  serotonin:{title:'Serotonin in the gut', kicker:'Mind–gut connection', body:['About 90% of the body’s serotonin is made in the gut, mostly by enterochromaffin cells in the gut lining. It helps control gut movement.','Gut bacteria help drive how much is made. Gut serotonin doesn’t cross into the brain, but the gut and brain stay in constant contact through the vagus nerve.'], refs:['yano','breit']}

const cardEl = $('#card'), lb = $('#lightbox'); let lastFocus = null;
lb.onclick = () => { lb.hidden = true; };
function openCard(key){
  const c = CARDS[key]; if (!c) return; lastFocus = document.activeElement;
  const sheet = cardEl.querySelector('.card-sheet'); sheet.style.setProperty('--c', NODE[state.n].color);
  sheet.innerHTML = `<div class="card-top"><div><div class="eyebrow">${esc(c.kicker)}</div><h3 id="cardTitle">${esc(c.title)}</h3></div><button class="close" aria-label="Close card">×</button></div>
    <div class="card-body">${c.body.map(p => `<p>${esc(p)}</p>`).join('')}
      <details class="refs" open><summary>Sources</summary><ol>${(c.refs||[]).map(r => `<li>${esc(REFS[r]||r)}</li>`).join('')}</ol></details></div>`;
  cardEl.hidden = false; sheet.scrollTop = 0; sheet.querySelector('.close').onclick = closeCard; sheet.querySelector('.close').focus(); }
function closeCard(){ cardEl.hidden = true; if (lastFocus && lastFocus.isConnected) lastFocus.focus(); }
cardEl.addEventListener('click', e => { if (e.target === cardEl) closeCard(); });
function bindTerms(root){ root.querySelectorAll('.term,[data-card]').forEach(t => t.onclick = e => { e.stopPropagation(); openCard(t.dataset.card); }); }
addEventListener('keydown', e => { if (e.key === 'Escape'){ if (!lb.hidden) lb.hidden = true; else if (!cardEl.hidden) closeCard(); else if (state.n !== 'ns') selectNode(NODE[state.n].parent || 'ns'); } });


/* ============ Body diagram: yellow CNS, blue PNS ============ */
const bodySvg = $('#bodySvg');
const BQ = sel => [...bodySvg.querySelectorAll(sel)];
// wide invisible copies so thin nerves are easy to tap
[['.som path','somatic'],['.vagus','par'],['.chain circle','sym'],['.heart','sym'],['.gut','ent'],['.cord','cord'],['.brainS','brain'],['.cbl','brain']].forEach(([sel, id]) => {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g.setAttribute('class', 'hit'); g.dataset.n = id;
  BQ(sel).forEach(el => { const c = el.cloneNode(); c.removeAttribute('class'); g.appendChild(c); }); bodySvg.appendChild(g); });
bodySvg.querySelectorAll('.hit').forEach(g => g.addEventListener('click', () => selectNode(g.dataset.n)));
function bodyHL(id){
  const all = '.cns,.som,.aut,.brainS,.cord,.cbl,.vagus,.chain,.heart,.gut';
  BQ(all).forEach(el => el.classList.remove('dim','mid','glowY','glowB','glowG','glowR','glowP','flowOut','flowIn'));
  const add = (sel, ...c) => BQ(sel).forEach(el => el.classList.add(...c));
  const cnsSet = ['cns','brain','cord','dorsal','ventral'], somSet = ['somatic','motion','touch'], autSet = ['autonomic','sym','par','ent'];
  if (cnsSet.includes(id)){ add('.som,.aut', 'dim');
    if (id === 'brain'){ add('.brainS,.cbl', 'glowY'); add('.cord', 'mid'); }
    else if (id === 'cns') add('.cns', 'glowY');
    else { add('.cord', 'glowY'); add('.brainS,.cbl', 'mid'); if (id === 'dorsal') add('.som', 'mid', 'flowIn'); if (id === 'ventral') add('.som', 'mid', 'flowOut'); } }
  else if (id === 'pns'){ add('.cns', 'dim'); add('.som', 'glowB'); add('.aut', 'glowB'); }
  else if (somSet.includes(id)){ add('.aut', 'dim'); add('.cns', 'mid'); add('.som', 'glowB'); if (id === 'motion') add('.som', 'flowOut'); if (id === 'touch') add('.som', 'flowIn'); }
  else if (autSet.includes(id)){ add('.som', 'dim'); add('.cns', 'mid');
    if (id === 'autonomic'){ add('.vagus', 'glowG'); add('.chain', 'glowR'); add('.heart,.gut', 'glowP'); }
    if (id === 'sym'){ add('.chain,.heart', 'glowR'); add('.vagus,.gut', 'dim'); }
    if (id === 'par'){ add('.vagus', 'glowG', 'flowOut'); add('.chain', 'dim'); }
    if (id === 'ent'){ add('.gut', 'glowP'); add('.chain,.heart', 'dim'); add('.vagus', 'mid'); } }
}

/* ============ Loop ============ */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now; T += dt;
  if (tween){ const k = Math.min(1, (now - tween.t0)/tween.dur), e = k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2;
    camera.position.lerpVectors(tween.from, tween.to, e); controls.target.lerpVectors(tween.tf, tween.tt, e); if (k >= 1) tween = null; }
  controls.update(); updScene(dt); updPulses(dt); drawHud(dt);
  renderer.render(scene, camera); placeTags();
  requestAnimationFrame(frame); }
resize(); renderPanel(); bodyHL('ns');
const [t0, d0, dir0] = viewFor('ns'); camera.position.copy(t0.clone().add(dir0.clone().normalize().multiplyScalar(d0*(isNarrow() ? 1.35 : 1)))); controls.target.copy(t0);
$('#loading').remove(); requestAnimationFrame(frame);

</script>
