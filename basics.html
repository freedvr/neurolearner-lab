<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brain Basics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a 3D journey (Big Bang to brain) and a playable Game of Life on the stage; chapters docked right; bottom sheet on phones. */
:root{
  color-scheme: dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0b0e14; --bg-2:#141a27; --panel:#11151e; --raise:#1a2030; --line:#283044;
  --fg:#eceef4; --muted:#a3abbc; --faint:#6e7689; --chalk:#f4d27a;
  --na:#ffb547; --k:#a58bff; --ca:#5fe0a3; --nt:#ff6fa5; --light:#7ad7ff; --hot:#ff7a59;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --panel-w:460px;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}

#stage{position:fixed;inset:0;background:radial-gradient(ellipse 75% 70% at 38% 42%,var(--bg-2) 0%,var(--bg) 72%)}
#stage canvas{display:block;touch-action:none;cursor:grab}
#stage canvas.hovering{cursor:pointer}

.brand{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:20px;z-index:5;pointer-events:none}
.home-link{pointer-events:auto;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.home-link:hover{color:var(--fg)}
.brand-sub{font-size:13px;font-weight:600;color:#ffd166;margin-top:2px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:2px 0 0}

/* scenario chips */
.chips{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);right:calc(var(--panel-w) + 16px);left:300px;z-index:5;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(17,21,30,.78);backdrop-filter:blur(6px);cursor:pointer;font-size:13.5px;white-space:nowrap}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--c,var(--chalk));background:color-mix(in srgb,var(--c,var(--chalk)) 24%,rgba(17,21,30,.9));font-weight:700}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--chalk))}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(17,21,30,.78);backdrop-filter:blur(6px)}
.seg button{border:0;background:none;padding:7px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--chalk);color:#16130a;font-weight:700}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 106px);left:20px;max-width:340px;z-index:5;background:rgba(17,21,30,.92);border:1px solid var(--line);border-left:3px solid var(--c,var(--chalk));border-radius:0 10px 10px 0;padding:10px 12px;font-size:13.5px;color:var(--fg);backdrop-filter:blur(6px)}
.toast b{display:block;font-family:var(--f-display);font-size:15px;margin-bottom:2px}
.toast .term{margin-top:4px;display:inline-block}

/* lab instruments */
.lab{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:5;width:min(420px,calc(100vw - var(--panel-w) - 40px));background:rgba(15,19,28,.9);border:1px solid var(--line);border-radius:14px;padding:14px 16px;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:10px}
.lab-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.readout{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.readout small{font-size:15px;color:var(--muted);font-weight:600;margin-left:3px}
.phase{font-size:13px;color:var(--muted);min-height:20px}
.phase b{color:var(--fg)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.slider-row{display:flex;align-items:center;gap:10px}
input[type=range]{flex:1;accent-color:var(--chalk);height:28px;margin:0}
.btn{padding:9px 15px;border-radius:9px;border:1px solid var(--line);background:var(--raise);cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--chalk);color:#16130a;border-color:var(--chalk)}
.btn.small{padding:6px 11px;font-size:13px}
.states{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.state{padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--faint)}
.state.on{color:#16130a;font-weight:700}
.state.closed.on{background:#8ea3c4}.state.open.on{background:var(--na)}.state.inact.on{background:#ff8f8f}
.state.k.on{background:var(--k)}
#trace{width:100%;height:120px;display:block;border-radius:8px;background:#0b0e14}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}

.mimage{position:fixed;right:calc(var(--panel-w) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:5;width:300px;background:rgba(15,19,28,.9);border:1px solid var(--line);border-radius:14px;padding:12px 14px;backdrop-filter:blur(8px)}
.mimage canvas{width:100%;height:auto;display:block;border-radius:8px;margin-top:6px}
.mimage .cap{font-size:12.5px;color:var(--muted);margin-top:6px}
.mimage h4{margin:2px 0 0;font-family:var(--f-display);font-size:16px}

/* labels on the neuron */
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.plabel{width:max-content;position:absolute;left:0;top:0;transform:translate(-50%,-140%);font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:6px;background:rgba(11,14,20,.85);border:1px solid var(--line);white-space:nowrap;pointer-events:none;transition:opacity .2s}
.plabel.hot{border-color:var(--chalk);color:var(--chalk)}
.plabel.ion{font-weight:400;font-family:var(--f-mono);font-size:11.5px}

/* panel */
#panel{box-sizing:border-box;position:fixed;top:0;right:0;bottom:0;width:var(--panel-w);background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;z-index:6;padding:calc(env(safe-area-inset-top,0px) + 24px) 26px calc(env(safe-area-inset-bottom,0px) + 26px);display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
#panel h2{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.015em;margin:4px 0 0;text-wrap:balance}
#panel p{margin:0;color:var(--fg);max-width:62ch}
#panel .lead{color:var(--muted)}
.topic-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.topic-btn{width:100%;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--raise);cursor:pointer}
.topic-btn:hover{border-color:var(--c)}
.topic-btn .k{font-family:var(--f-mono);font-size:11px;color:var(--c);letter-spacing:.06em}
.topic-btn b{font-family:var(--f-display);font-size:17px}
.back{align-self:flex-start;background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:14px}
.back:hover{color:var(--fg)}
.topic-head .eyebrow{color:var(--c)}
.blist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.blist li::marker{color:var(--c)}
.figure{margin:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;display:flex;flex-direction:column;gap:8px}
.figure img{display:block;width:100%;border-radius:7px;cursor:zoom-in;background:#fff}
.figure.narrow img{width:auto;max-height:300px;margin:0 auto}
.figure figcaption{font-size:12.5px;color:var(--muted)}
.mn{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mn-title{padding:8px 12px;background:color-mix(in srgb,var(--c) 18%,var(--raise));font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.mn-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.mn-row .L{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;color:var(--c);text-align:center}
.mn-row b{font-family:var(--f-display);font-size:16px}
.mn-row .mem{display:block;color:var(--chalk);font-weight:700;font-size:14px}
.mn-row .det{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.pairs{display:grid;grid-template-columns:minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pairs div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.pairs div:first-child{border-top:0}
.see3d{display:inline-block;margin-top:4px;background:none;border:0;padding:0;color:var(--c,#f4d27a);font:inherit;font-weight:700;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.pairs dt{color:var(--muted);margin:0}.pairs dd{margin:0}
.tries{display:flex;flex-wrap:wrap;gap:8px}
.try{border:1px dashed var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);color:var(--fg);padding:8px 13px;border-radius:9px;cursor:pointer;font-weight:700;font-size:13.5px}
.try:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}
.parts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.part{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--raise)}
.part b{display:block;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.part:hover,.part:focus-visible{border-color:var(--c)}
.part[aria-pressed="true"]{border-color:var(--chalk);background:color-mix(in srgb,var(--chalk) 14%,var(--raise))}
.case{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;cursor:pointer;border-left:3px solid var(--c);padding:10px 12px;background:rgba(0,0,0,.22);border-radius:0 8px 8px 0;font-size:14px}
.case:hover,.case:focus-visible{background:color-mix(in srgb,var(--c) 14%,rgba(0,0,0,.2))}
.case .eyebrow{color:var(--c)}
.go-card{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--fg);border:1px solid var(--c);border-radius:10px;padding:12px 14px;background:color-mix(in srgb,var(--c) 14%,var(--raise))}
.go-card b{font-family:var(--f-display);font-size:17px}
.go-card:hover{background:color-mix(in srgb,var(--c) 24%,var(--raise))}
.case-go{font-size:12.5px;color:var(--c);font-weight:700;margin-top:2px}
.qa{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.qa .q{font-weight:700}
.qa .a{color:var(--muted);font-size:14px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px}
.note{font-size:12.5px;color:var(--faint)}
.term{all:unset;cursor:pointer;font-weight:700;border-bottom:2px solid var(--c,var(--chalk));padding:0 1px;border-radius:2px;background:color-mix(in srgb,var(--c,var(--chalk)) 14%,transparent)}
.term:hover,.term:focus-visible{background:color-mix(in srgb,var(--c,var(--chalk)) 30%,transparent)}

/* cards */
#card[hidden]{display:none}
#card{position:fixed;inset:0;right:var(--panel-w);z-index:8;display:grid;place-items:center;padding:24px;background:rgba(8,10,14,.55);backdrop-filter:blur(3px)}
.card-sheet{width:min(640px,100%);max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);overscroll-behavior:contain}
.card-top{position:sticky;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 12px;background:var(--panel);border-bottom:1px solid var(--line);z-index:1}
.card-top .eyebrow{color:var(--c)}
.card-top h3{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;margin:3px 0 0;text-wrap:balance}
.close{flex:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--raise);cursor:pointer;font-size:20px;line-height:1}
.card-body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px}
.cfig{margin:0;border-radius:10px;overflow:hidden;border:1px solid var(--line)}.cfig svg{display:block;width:100%;height:auto}.cfig figcaption{font-size:13px;color:var(--muted);padding:8px 12px}
.card-body p{margin:0;max-width:62ch}
.refs{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.refs summary{cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.refs ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
#lightbox[hidden]{display:none}
#lightbox{position:fixed;inset:0;background:rgba(5,7,10,.94);z-index:12;display:grid;place-items:center;padding:24px;cursor:zoom-out}
#lightbox img{max-width:100%;max-height:100%;border-radius:10px;object-fit:contain;background:#fff}
#loading{position:fixed;left:0;right:var(--panel-w);top:46%;text-align:center;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);z-index:1}

.plabel.big{font-size:15px;padding:4px 11px}
.plabel .eyebrow{font-size:10px}
.scene-hud{display:none}
#panel > *{flex-shrink:0}
body[data-scene="bump"] .lab-only, body[data-scene="membrane"] .lab-only{display:none!important}
body[data-scene="membrane"] #memHud, body[data-scene="bump"] #bumpHud{display:flex}
.hud-row{display:flex;flex-wrap:wrap;gap:8px}
.hud-btn{padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--raise);cursor:pointer;font-weight:700;font-size:13.5px}
.hud-btn[aria-pressed="true"]{background:var(--c,var(--chalk));color:#16130a;border-color:var(--c,var(--chalk))}
.hud-btn:hover{border-color:var(--muted)}
.bump-pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bump-pick button{padding:8px 4px;border-radius:9px;border:1px solid var(--line);background:var(--raise);cursor:pointer;text-align:center}
.bump-pick b{display:block;font-family:var(--f-display);font-size:24px;line-height:1;color:var(--c)}
.bump-pick span{font-size:11.5px;color:var(--muted)}
.bump-pick button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--raise))}
.mn-pick{all:unset;box-sizing:border-box;cursor:pointer;width:100%}
.mn-pick:hover .mn-row,.mn-pick:focus-visible .mn-row{background:color-mix(in srgb,var(--c) 10%,transparent)}
.mn-pick[aria-pressed="true"] .mn-row{background:color-mix(in srgb,var(--c) 18%,transparent)}
.mn-hint{font-size:12px;color:var(--faint);padding:6px 12px;border-top:1px solid var(--line)}
@media (max-width:1180px){ .mimage{display:none} }
@media (max-width:820px){
  :root{--panel-w:0px}
  #panel{width:auto;top:auto;left:0;height:46%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 20px)}
  #panel h2{font-size:24px}
  .brand h1{font-size:17px}
  .chips{left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 58px);flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-bottom:4px}
  .toast{display:none}
  .lab{left:10px;right:10px;width:auto;bottom:calc(46% + 8px);padding:10px 12px;gap:7px}
  #trace,.states{display:none}
  .phase{font-size:12.5px}
  .readout{font-size:26px}
  .legend{display:none}
  #card{right:0;padding:0} .card-sheet{border-radius:0;height:100%;max-height:none}
  .pairs div{grid-template-columns:110px minmax(0,1fr)}
  .parts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hud{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:5;width:min(520px,calc(100vw - var(--panel-w) - 40px));background:rgba(15,19,28,.92);border:1px solid var(--line);border-radius:14px;padding:12px 14px;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:8px}
#hudCanvas{width:100%;height:auto;display:block;border-radius:8px}
#hudText{font-size:13.5px;color:var(--muted);min-height:40px}
#hudText b{color:var(--fg)}
.plabel{width:max-content}
.plabel.elec{font-family:var(--f-mono);font-size:10.5px;padding:1px 5px;font-weight:500;background:rgba(11,14,20,.75)}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.mbtn{width:100%;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;padding:10px 13px;border-radius:10px;border:1px solid var(--line);background:var(--raise);cursor:pointer}
.mbtn:hover,.mbtn:focus-visible{border-color:var(--c)}
.mbtn .mn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#0b0e14;font-family:var(--f-display);font-weight:800;font-size:16px}
.mbtn b{display:block;font-family:var(--f-display);font-size:16.5px}
.mbtn span span{display:block;font-size:12.5px;color:var(--muted)}
.rw{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;white-space:nowrap}
.rw::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--k)}
.rwkey{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.chart svg{width:100%;height:auto;display:block}
.chart .pt{cursor:pointer}
.chart .pt:hover text,.chart .pt:focus text{fill:var(--chalk)}
.chart{background:var(--bg)}
.long{color:var(--muted);font-size:14px;margin-top:2px}
.mem-line{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--chalk);line-height:1.3}
.specs dt{color:var(--muted)}
.cases{display:flex;flex-direction:column;gap:8px}
.try[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 30%,transparent);border-style:solid}
.quiz{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--raise)}
.quiz .q{font-weight:700;margin:0}
.qopts{display:flex;flex-wrap:wrap;gap:6px}
.qopt{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700;font-size:13px}
.qopt:hover:not(:disabled){border-color:var(--chalk)}
.qopt[aria-pressed="true"]{background:var(--chalk);color:#16130a}
.qfb{margin:0;font-size:14px}
.qfb.ok{color:#5fe0a3}.qfb.bad{color:#ffb0a0}
.fm{border:1px solid var(--c);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--c) 8%,var(--raise))}
.fm-steps{display:flex;flex-direction:column;gap:6px}
.fms{padding:8px 10px;border-radius:8px;border:1px solid var(--line);opacity:.45;font-size:13.5px}
.fms b{display:block}
.fms.on{opacity:1;border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.fms.done{opacity:.75}
#panel a{color:var(--chalk)}
.qa{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.qa .q{font-weight:700}.qa .a{color:var(--muted);font-size:14px}

const CONTENT = {
  hard:{
    mn:'Elementary particles → brains',
    lead:'Neuroscience is a lot to learn: many terms, and processes running in parallel across many brain regions. Here’s why it’s so complicated: the brain was never designed. It was built on the go over billions of years.',
    goals:'Semester goals: understand how neurons fire, learn the parts of the brain and what they do, and face the mystery of how neurons firing gives rise to consciousness, emotion, experience and behavior.',
    points:[
      'Natural selection piled new systems on top of old ones, and everything is squished into a small space. Studying the brain is like untangling a knot tied over nearly an eon.',
      'That’s what makes neuroscience hard, and it’s also what makes the brain so amazing.',
      '<b>Conservation</b>: parts that work get kept across species and deep time ([[conservation|examples]]). The action potential’s ion channels are over a billion years old, and your brainstem looks more like a fish’s than a philosopher’s.',
      'Glutamate and GABA exist in plants and microbes. Circadian clocks run in cyanobacteria, plants, insects and you: your sleep cycle is older than animals.',

    mn:'Simple rules + interaction + time → complexity',
    lead:'Conway’s Game of Life is a grid of cells that are alive or dead. Four simple rules decide what happens next, and from them surprisingly complex patterns emerge: gliders, oscillators, even “guns” that shoot gliders forever.',

    points:[

const MYTHS = [
  { id:'ten', claim:'We only use 10% of our brains.', demo:'ten',
    body:['<b>Myth.</b> Brain scans (fMRI, PET) show virtually the whole brain is active over a day, even during sleep.','The brain is about 2% of body weight but uses about 20% of the body’s energy. Evolution wouldn’t keep such an expensive organ if 90% of it did nothing.','Damage almost anywhere in the brain (stroke, tumor, injury) causes problems. If 90% were spare, most injuries would have no effect.','Where it came from: William James wrote in 1907 that people use only a small part of their possible mental resources. He meant effort and potential, not brain tissue. Self-help writers turned that into “10%,” early scientists called areas they didn’t understand “silent,” and movies like <i>Lucy</i> and <i>Limitless</i> kept it alive.'], refs:['james','raichle'] },
  { id:'light', claim:'Nerve impulses travel at the speed of light.', demo:'light',
    body:['<b>Myth.</b> Action potentials travel about 1 to over 100 meters per second (about 2 to 225 mph). Light travels about 300,000 <i>kilometers</i> per second.','Speed depends on myelin (saltatory conduction: the signal jumps from node to node), axon diameter (wider is faster), and temperature (warmer is faster).'], refs:['kandel'] },
  { id:'sex', claim:'Male and female brains are exactly the same.',
    body:['<b>Myth, but with a big caveat.</b> On average, there are some differences: studies report differences in connectivity patterns, in which areas activate during some tasks, and in the effects of hormones like estrogen and testosterone on development.','But the overlap is huge: differences between individuals within each sex are usually bigger than the average difference between the sexes, and there’s no consistent evidence of differences in overall intelligence based on brain anatomy. Some researchers argue most brains are a “mosaic” of features.'], refs:['ingalhalikar','joel','eliot'] },
  { id:'cell', claim:'Each memory has its own brain cell.',
    body:['<b>Myth.</b> The “grandmother cell” idea says one neuron recognizes one specific thing, like your grandmother. Some neurons do respond very selectively (one famously fired to pictures of Jennifer Aniston), but if one neuron dies, you don’t forget your grandmother.','Memories are stored in networks: changes in synaptic connections (strengthened by long-term potentiation) across groups of neurons called engram cells, spread across several brain regions.'], refs:['quiroga','josselyn'] },
  { id:'lr', claim:'People are either left-brained or right-brained.', demo:'lr',
    body:['<b>Myth.</b> It grew out of Roger Sperry’s split-brain research, where cutting the corpus callosum revealed that each hemisphere has specialties. That got oversimplified.','The left hemisphere is generally more involved in language and the right in spatial skills, faces and music, and each controls the opposite side of the body. But both hemispheres work together in almost every task, and a large brain-scan study found no evidence that some people are “left-brained” or “right-brained.”'], refs:['gazzaniga','nielsen'] },

const CARDS = {
  conservation:{title:'Conservation in evolution', kicker:'Key term', body:['Conservation means a structure or mechanism is preserved across species and deep time because it works and helps survival. In the brain, core circuits, molecules and functions stay largely the same while new layers are added.','The action potential: voltage-gated Na⁺ and K⁺ channels existed in single-celled organisms over a billion years ago, used for sensing and movement. When you fire a neuron, you’re watching evolution refuse to redesign something that already worked.','The brainstem: it controls breathing, heart rate and sleep–wake cycles, and it’s structurally similar in fish, reptiles and mammals. Damage it and you die, however intelligent you are.','The bigger evolutionary story isn’t brand-new parts appearing: it’s massive expansion and reorganization of old ones, especially the cortex.'], refs:['kandel']},
  folding:{title:'Why the brain is folded', kicker:'Side quest', body:['Folding increases the cortex’s surface area without making the head bigger, fitting in more neurons and synapses. The folding happens in the outer layer, the cerebral cortex, where higher cognition happens.','The ridges are gyri (singular: gyrus); the valleys are sulci (singular: sulcus). Folded brains are “gyrencephalic” (humans, dolphins, cats); smooth ones are “lissencephalic” (mice, rats).','Folding mostly happens before birth. Abnormal folding is linked to severe intellectual disability and epilepsy.'], refs:['kandel']},
  membrane:{title:'The membrane: where everything happens', kicker:'Side quest', body:['A neuron doesn’t “think” in its cytoplasm or “feel” in its nucleus. The important things happen at the membrane.','The membrane senses the world (receptors), integrates signals (summation), stores tension (ion gradients), encodes information (spikes) and reshapes itself (plasticity): sensor, computer, memory surface and energy system all in one.','Even long-term learning starts there: calcium entering through NMDA receptors at a synapse triggers the spine to grow. You’ll explore the membrane’s four “holes” in the Membrane Lab.'], refs:['kandel']},
  boltzmann:{title:'Boltzmann brains', kicker:'Side quest', body:['The Game of Life shows complexity emerging from simple rules and time. Physicists have asked the opposite question: could a conscious brain appear purely by chance?','A Boltzmann brain (after physicist Ludwig Boltzmann, who studied entropy) is a hypothetical self-aware mind that pops out of random fluctuations in a vast or eternal universe, briefly “wakes up” with false memories, then falls apart.','The paradox: if random brains were more common than evolved ones, you should expect to be one. Since we see a stable, lawful universe, most physicists treat models that predict lots of Boltzmann brains as flawed.'], refs:['albrecht']},
  counting:{title:'Counting the brain', kicker:'Suzana Herculano-Houzel', body:['Instead of estimating from small samples, her lab dissolved brains into a uniform “soup” of cell nuclei, then counted the nuclei and stained the ones belonging to neurons.','Result: about 86 billion neurons and about 85 billion non-neuronal cells (mostly glia) in the human brain, not the 10-to-1 ratio in older textbooks.','The same method found about 257 billion neurons in an elephant brain, mostly in its cerebellum. So it’s not just the count that matters, but where the neurons are and how they connect.'], refs:['azevedo','elephant']},

function golDraw(){ const {w, h, a, cell} = GOL; const W = golEl.width/Math.min(devicePixelRatio, 2), H = golEl.height/Math.min(devicePixelRatio, 2);
  gx.fillStyle = 'rgba(8,10,16,0.93)'; gx.fillRect(0, 0, W, H);
  gx.strokeStyle = 'rgba(95,224,163,0.07)'; gx.lineWidth = 1; gx.beginPath(); for (let x=0;x<=w;x++){ gx.moveTo(x*cell + 0.5, 0); gx.lineTo(x*cell + 0.5, h*cell); } for (let y=0;y<=h;y++){ gx.moveTo(0, y*cell + 0.5); gx.lineTo(w*cell, y*cell + 0.5); } gx.stroke();
  let pop = 0; for (let y=0;y<h;y++) for (let x=0;x<w;x++) if (a[y*w+x]){ pop++; gx.fillStyle = `hsl(${150 + ((x + y)*2) % 60}, 75%, 62%)`; gx.fillRect(x*cell + 1, y*cell + 1, cell - 2, cell - 2); }
  $('#golGen').textContent = GOL.gen; $('#golPop').textContent = pop; }
const PRESETS = {
  glider:{name:'Glider', cells:[[1,0],[2,1],[0,2],[1,2],[2,2]]},
  pulsar:{name:'Pulsar (oscillator)', cells:(() => { const c = []; [0,5,7,12].forEach(y => [2,3,4,8,9,10].forEach(x => { c.push([x, y]); c.push([y, x]); })); return c; })()},
  gun:{name:'Glider gun', cells:[[0,4],[0,5],[1,4],[1,5],[10,4],[10,5],[10,6],[11,3],[11,7],[12,2],[12,8],[13,2],[13,8],[14,5],[15,3],[15,7],[16,4],[16,5],[16,6],[17,5],[20,2],[20,3],[20,4],[21,2],[21,3],[21,4],[22,1],[22,5],[24,0],[24,1],[24,5],[24,6],[34,2],[34,3],[35,2],[35,3]]},
  rpent:{name:'R-pentomino (chaos from 5 cells)', cells:[[1,0],[2,0],[0,1],[1,1],[1,2]]},
  random:{name:'Random soup'}
};
function golClear(){ GOL.a.fill(0); GOL.gen = 0; golDraw(); }
function golPreset(k){ golClear(); GOL.seeded = true; if (k === 'random'){ for (let i=0;i<GOL.a.length;i++) GOL.a[i] = Math.random() < 0.22 ? 1 : 0; }
  else { const c = PRESETS[k].cells, ox = Math.floor(GOL.w*(k === 'gun' ? 0.12 : 0.42)), oy = Math.floor(GOL.h*(k === 'gun' ? 0.15 : 0.4)); c.forEach(([x, y]) => { const xx = ox + x, yy = oy + y; if (xx < GOL.w && yy < GOL.h) GOL.a[yy*GOL.w + xx] = 1; }); }
  golDraw(); }
function golRun(on){ GOL.run = on; const b = $('#golPlay'); if (b){ b.textContent = on ? '❚❚ Pause' : '▶ Play'; b.setAttribute('aria-pressed', String(on)); } }
let painting = -1;
function golCellAt(e){ const r = golEl.getBoundingClientRect(); return [Math.floor((e.clientX - r.left)/GOL.cell), Math.floor((e.clientY - r.top)/GOL.cell)]; }
golEl.addEventListener('pointerdown', e => { const [x, y] = golCellAt(e); if (x < 0 || y < 0 || x >= GOL.w || y >= GOL.h) return; const i = y*GOL.w + x; painting = GOL.a[i] ? 0 : 1; GOL.a[i] = painting; golEl.setPointerCapture(e.pointerId); golDraw(); });
golEl.addEventListener('pointermove', e => { if (painting < 0) return; const [x, y] = golCellAt(e); if (x < 0 || y < 0 || x >= GOL.w || y >= GOL.h) return; GOL.a[y*GOL.w + x] = painting; golDraw(); });
addEventListener('pointerup', () => { painting = -1; });
$('#golPlay').onclick = () => golRun(!GOL.run);
$('#golStep').onclick = () => { golRun(false); golStep(); golDraw(); };
$('#golClear').onclick = () => { golRun(false); golClear(); };
$('#golSpeed').oninput = e => { GOL.speed = +e.target.value; };
$('#golPresets').innerHTML = Object.entries(PRESETS).map(([k, p]) => `<button class="hud-btn" data-p="${k}">${esc(p.name)}</button>`).join('');
$('#golPresets').querySelectorAll('[data-p]').forEach(b => b.onclick = () => { golPreset(b.dataset.p); golRun(true); });

/* ============ HUD (timeline + messages) ============ */
const hud = $('#hudCanvas'), hx = hud.getContext('2d'), HW = hud.width, HH = hud.height, hudTitle = $('#hudTitle'), hudText = $('#hudText'), hudNav = $('#hudNav');
function drawTimeline(){ hx.clearRect(0,0,HW,HH); const x0 = 50, x1 = HW - 40, y = 100, lx = ya => x0 + STOPS.findIndex(s => s.ya === ya)/(STOPS.length - 1)*(x1 - x0);
  hx.strokeStyle = '#283044'; hx.lineWidth = 6; hx.lineCap = 'round'; hx.beginPath(); hx.moveTo(x0, y); hx.lineTo(x1, y); hx.stroke();
  const cur = STOPS[state.stop]; hx.strokeStyle = '#7ad7ff'; hx.beginPath(); hx.moveTo(x0, y); hx.lineTo(lx(cur.ya), y); hx.stroke();
  STOPS.forEach((s, i) => { const x = lx(s.ya), on = i <= state.stop; hx.fillStyle = on ? '#7ad7ff' : '#1a2030'; hx.strokeStyle = on ? '#7ad7ff' : '#3a4258'; hx.lineWidth = 3; hx.beginPath(); hx.arc(x, y, i === state.stop ? 13 : 9, 0, 7); hx.fill(); hx.stroke();
    hx.fillStyle = i === state.stop ? '#eceef4' : '#6e7689'; hx.font = `${i === state.stop ? 800 : 600} 15px "Atkinson Hyperlegible", system-ui`; hx.textAlign = 'center'; hx.fillText(s.title.replace('Side quest: ', ''), x, i % 2 ? y + 42 : y - 26); });
  hx.textAlign = 'left'; hx.fillStyle = '#6e7689'; hx.font = '500 14px "IBM Plex Mono", monospace'; hx.fillText('13.8 billion years ago', x0 - 10, HH - 18); hx.textAlign = 'right'; hx.fillText('(not to scale) · today →', x1 + 10, HH - 18); hx.textAlign = 'left'; }
function drawRace(){ hx.clearRect(0,0,HW,HH); const x0 = 60, x1 = HW - 60;
  [['Light: 300,000 km/s', '#fff6c8', 1], ['Fast nerve impulse: ~120 m/s', '#ffb547', RACE.t >= 0 ? clamp(RACE.t/6, 0, 1)*0.0004*2500 : 0]].forEach(([l, c, k], i) => { const y = 70 + i*80;
    hx.strokeStyle = '#283044'; hx.lineWidth = 6; hx.beginPath(); hx.moveTo(x0, y); hx.lineTo(x1, y); hx.stroke();
    hx.fillStyle = c; hx.beginPath(); hx.arc(x0 + (x1 - x0)*Math.min(1, RACE.t >= 0 ? k : 0), y, 11, 0, 7); hx.fill(); hx.fillStyle = '#eceef4'; hx.font = '700 17px "Atkinson Hyperlegible", system-ui'; hx.fillText(l, x0, y - 18); });
  hx.fillStyle = '#a3abbc'; hx.font = '500 15px "Atkinson Hyperlegible", system-ui'; hx.fillText('Light is about 2.5 million times faster. In the time light circles Earth 7 times, a nerve signal moves about 120 meters.', x0, 222); }
function drawHud(){ const ch = state.ch; let title = CH[ch].title, msg = hudMsg, mode = null;
  if (ch === 'hard'){ mode = 'timeline'; title = `${STOPS[state.stop].when}: ${STOPS[state.stop].title}`; msg = msg || STOPS[state.stop].text; }
  else if (ch === 'myths' && RACE.t >= 0){ mode = 'race'; }
  else if (ch === 'nums'){ msg = msg || 'Each sparkle is a neuron firing. Your brain holds about as many neurons as the Milky Way (left) holds stars.'; }
  else if (ch === 'mind'){ msg = msg || 'Gears inside a glass brain: Leibniz’s mill. Press “Walk into the mill” to step inside.'; }
  else if (ch === 'myths'){ msg = msg || 'Flip the cards on the right. Some come with a demo on this brain.'; }
  else if (ch === 'life'){ msg = msg || 'Click or drag on the grid to draw cells. Pick a pattern, then press Play.'; }
  hud.hidden = !mode; hudNav.hidden = ch !== 'hard'; $('.hud').hidden = ch === 'life';
  if (mode === 'timeline') drawTimeline(); else if (mode === 'race') drawRace();
  if (hudTitle.textContent !== title) hudTitle.textContent = title; if (hudText.innerHTML !== msg) hudText.innerHTML = msg; }
$('#prevStop').onclick = () => goStop(state.stop - 1); $('#nextStop').onclick = () => goStop(state.stop + 1);

/* ============ Update ============ */
function updScene(dt){
  actU.uT.value = T;
  // big bang: breathe outward
  const k = (T*0.25) % 1, A = bang.geometry.attributes.position, base = bang.userData.base; for (let i=0;i<A.count*3;i++) A.array[i] = base[i]*(0.4 + k*4.2); A.needsUpdate = true; bang.material.opacity = 1 - k*0.8; core.scale.setScalar(2.5*(1 - k) + 0.3);
  galaxy.rotation.y += dt*0.05; galaxy2.rotation.y += dt*0.05;
  planets.forEach(p => { const a = T*p.userData.sp + p.userData.ph; p.position.set(Math.cos(a)*p.userData.r, 0, Math.sin(a)*p.userData.r); });
  earth.rotation.y += dt*0.15; cellG.rotation.y += dt*0.12;
  fishG.userData.tail.rotation.y = 0.4*Math.sin(T*5); fishG.position.y = 0.15*Math.sin(T*1.3); fishG.userData.brain.material.emissive = fishG.userData.brain.material.emissive || lin('#000'); fishG.userData.brain.material.emissiveIntensity = 0.4 + 0.3*Math.sin(T*4); fishG.userData.brain.material.emissive.set('#ff9a5a');
  brainG.rotation.y = state.ch === 'mind' && state.mind === 'mill' ? 0 : Math.sin(T*0.2)*0.35;
  gears.children.forEach(g => g.rotation.z += dt*g.userData.sp);
  if (state.demo === 'lr') actU.uSide.value = Math.sin(T*0.8);
  if (RACE.t >= 0){ RACE.t += dt; beadLight.position.x = RACE.t > 0.1 ? 3 : -3; beadNerve.position.x = -3 + clamp(RACE.t/6, 0, 1)*0.0004*2500*6; if (RACE.t > 9){ RACE.t = -1; raceG.visible = false; } }
  if (GOL.run && state.ch === 'life'){ GOL.acc += dt*GOL.speed; let n = 0; while (GOL.acc >= 1 && n < 4){ golStep(); GOL.acc -= 1; n++; } if (n) golDraw(); }
}

/* ============ Labels ============ */
function mkTag(html, world, show, cls='plabel'){ const el = document.createElement('div'); el.className = cls; el.innerHTML = html; labelsEl.appendChild(el); return {el, world, show}; }
const TAGS = [
  ...STOPS.map((s, i) => mkTag(`<span class="when">${esc(s.when)}</span>${esc(s.title)}`, () => stopGroups[i].position.clone().add(V(0, [3.2,3,2.6,3,2.8,2,2.6][i], 0)), () => state.ch === 'hard' && Math.abs(state.stop - i) <= 1, 'plabel big')),
  mkTag('Milky Way: ~100 billion stars', () => galaxy2.position.clone().add(V(0, 2.2, 0)), () => state.ch === 'nums', 'plabel big'),
  mkTag('Your brain: ~86 billion neurons', () => V(BRAIN_X, 2.3, 0), () => state.ch === 'nums', 'plabel big'),
  mkTag('Parts pushing parts…', () => V(BRAIN_X, 1.4, 0), () => state.ch === 'mind', 'plabel big'),
  mkTag('The “10%”', () => brainG.localToWorld(V(0.55, 0.2, 0.75)), () => state.ch === 'myths' && state.demo === 'ten', 'plabel hot')
];
const _v = V();
function placeTags(){ const w = innerWidth, h = innerHeight; TAGS.forEach(t => { const on = t.show(); if (!on){ t.el.style.opacity = 0; return; }
  _v.copy(t.world()).project(camera); if (_v.z > 1 || Math.abs(_v.x) > 1.1){ t.el.style.opacity = 0; return; } t.el.style.opacity = 1;
  t.el.style.transform = `translate(${(_v.x*0.5+0.5)*w}px, ${(-_v.y*0.5+0.5)*h}px) translate(-50%, -140%)`; }); }

/* ============ Panel ============ */
const fmt = s => esc(s).replace(/&lt;(\/?)(b|i)&gt;/g, '<$1$2>').replace(/\[\[(\w+)\|([^\]]+)\]\]/g, (m, k, t) => `<button class="term" data-card="${k}">${t}</button>`);
const fig = ([src, cap], narrow) => `<figure class="figure${narrow ? ' narrow' : ''}"><img src="${src}" alt="${esc(cap)}" data-zoom><figcaption>${esc(cap)}</figcaption></figure>`;
function tabs(){ return `<nav class="chtabs" aria-label="Chapters">${CHAPTERS.map(c => `<button class="chtab" data-ch="${c.id}" style="--c:${c.color}" aria-current="${state.ch === c.id}"><span>${c.n}</span>${esc(c.short)}</button>`).join('')}</nav>`; }
function pager(){ const i = CHAPTERS.findIndex(c => c.id === state.ch), p = CHAPTERS[i-1], n = CHAPTERS[i+1];
  return `<div class="pager">${p ? `<button class="btn" data-ch="${p.id}">← ${esc(p.short)}</button>` : '<span></span>'}${n ? `<button class="btn primary" data-ch="${n.id}">${esc(n.short)} →</button>` : '<a class="btn primary" href="neurons.html">Next: Neurons →</a>'}</div>`; }
function renderPanel(){
  const c = CH[state.ch], C = CONTENT[state.ch]; panel.style.setProperty('--c', c.color);
  let h = `<div><div class="eyebrow">Unit 1 · Brain basics</div><h2>${esc(c.title)}</h2></div>${tabs()}<div class="mem-line">${esc(C.mn)}</div><p class="lead">${fmt(C.lead)}</p>`;
  if (state.ch === 'hard'){
    const s = STOPS[state.stop];
    h += `<p class="note-goal">${esc(C.goals)}</p>
      <div class="eyebrow">From the Big Bang to your brain · ${state.stop + 1} of ${STOPS.length}</div>
      <ol class="stops">${STOPS.map((x, i) => `<li><button class="stop" data-stop="${i}" aria-current="${i === state.stop}"><span class="when">${esc(x.when)}</span><b>${esc(x.title)}</b></button></li>`).join('')}</ol>
      <section class="stopcard"><div class="eyebrow">${esc(s.when)}</div><h3>${esc(s.title)}</h3>${fig(s.img, true)}<p>${esc(s.text)}</p>${s.card ? `<button class="case" data-card="${s.card}"><span class="eyebrow">Side quest</span><span>The membrane: where everything happens</span><span class="case-go">Open →</span></button>` : ''}
        <div class="pager"><button class="btn" id="sPrev" ${state.stop ? '' : 'disabled'}>← Back in time</button><button class="btn primary" id="sNext">${state.stop < STOPS.length - 1 ? 'Forward in time →' : 'Next chapter →'}</button></div></section>
      <ul class="blist">${C.points.map(p => `<li>${fmt(p)}</li>`).join('')}</ul>
      <div class="cases"><button class="case" data-card="conservation"><span class="eyebrow">Key term</span><span>Conservation: what evolution kept</span><span class="case-go">Open →</span></button><button class="case" data-card="folding"><span class="eyebrow">Side quest</span><span>Why does the brain look folded?</span><span class="case-go">Open →</span></button></div>`;
  } else if (state.ch === 'life'){
    h += `<div class="rules">${C.rules.map(([t, d], i) => `<div class="rule"><span class="L">${i + 1}</span><span><b>${esc(t)}</b><span>${esc(d)}</span></span></div>`).join('')}</div>
      <ul class="blist">${C.points.map(p => `<li>${fmt(p)}</li>`).join('')}</ul>
      ${fig(['img/bb/gol-art.jpg','The Game of Life as art. From your slides.'], true)}
      <p class="note">In conclusion: complexity doesn’t require intelligence at the start, only rules, interaction and time. Professor Freed’s provocation: to an artificial superintelligence, might our “simple” interactions look like the rules that gave rise to it?</p>`;
  } else if (state.ch === 'nums'){
    h += `<div class="nums">${NUMS.map(n => `<button class="numcard" data-num="${n.k}" aria-pressed="${state.num === n.k}"><b>${esc(n.big)}</b><span>${esc(n.label)}</span>${state.num === n.k ? `<span class="cmp">${esc(n.cmp)}<span class="src">${esc(REFS[n.ref].split('(')[0].trim())} (${esc((REFS[n.ref].match(/\((\d{4})/) || ['',''])[1])})</span></span>` : ''}</button>`).join('')}</div>
      <ul class="blist">${C.points.map(p => `<li>${fmt(p)}</li>`).join('')}</ul>
      ${fig(['img/bb/brain-circuit.jpg','From your slides.'], true)}`;
  } else if (state.ch === 'mind'){
    h += `<div class="tries"><button class="try" data-act="mill">▶ Walk into the mill</button></div>
      ${fig(['img/bb/mill.jpg','Leibniz’s mill. From your slides.'], true)}
      <ul class="blist">${C.points.map(p => `<li>${fmt(p)}</li>`).join('')}</ul>
      <div class="mimgrid">${[['img/bb/emergence.jpg','Emergence'],['img/bb/dualism.jpg','Dualism?']].map(([s, t]) => `<button class="mim" data-zoomsrc="${s}"><img src="${s}" alt="${esc(t)}: illustration from your slides"><span>${esc(t)}</span></button>`).join('')}</div>
      <section class="qa"><div class="q">Class discussion: does the brain create the mind?</div><ul class="blist">${C.discuss.map(q => `<li>${esc(q)}</li>`).join('')}</ul></section>`;
  } else if (state.ch === 'myths'){
    h += `<div class="myths">${MYTHS.map(m => { const st = state.myth[m.id]; return `<section class="myth${st ? ' open' : ''}">
        <div class="claim">“${esc(m.claim)}”</div>
        ${st ? `<div class="verdict ${st === 'myth' ? 'ok' : 'bad'}">${st === 'myth' ? 'You said myth. Right.' : 'You said fact. Actually, it’s a myth.'}</div>${m.body.map(p => `<p>${fmt(p)}</p>`).join('')}
          ${m.demo ? `<button class="try" data-act="${m.demo}">▶ ${m.demo === 'ten' ? 'Show it on the brain' : m.demo === 'light' ? 'Race light vs. a nerve impulse' : 'Watch both hemispheres'}</button>` : ''}
          <details class="refs"><summary>Sources</summary><ol>${m.refs.map(r => `<li>${esc(REFS[r])}</li>`).join('')}</ol></details>`
        : `<div class="mf"><button class="btn" data-m="${m.id}" data-v="myth">Myth</button><button class="btn" data-m="${m.id}" data-v="fact">Fact</button></div>`}</section>`; }).join('')}</div>
      <p class="note">Score: ${Object.entries(state.myth).filter(([, v]) => v === 'myth').length} of ${Object.keys(state.myth).length} answered correctly.</p>`;
  }
  h += pager();
  panel.innerHTML = h;
  panel.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => setChapter(b.dataset.ch));
  panel.querySelectorAll('[data-stop]').forEach(b => b.onclick = () => goStop(+b.dataset.stop));
  const sp = $('#sPrev'), sn = $('#sNext'); if (sp) sp.onclick = () => goStop(state.stop - 1); if (sn) sn.onclick = () => state.stop < STOPS.length - 1 ? goStop(state.stop + 1) : setChapter('life');
  panel.querySelectorAll('[data-num]').forEach(b => b.onclick = () => { state.num = state.num === b.dataset.num ? null : b.dataset.num; const n = NUMS.find(x => x.k === state.num); hudMsg = n ? `<b>${esc(n.big)} ${esc(n.label)}.</b> ${esc(n.cmp)}` : ''; renderPanel(); });
  panel.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { state.myth[b.dataset.m] = b.dataset.v; renderPanel(); });
  panel.querySelectorAll('.try').forEach(b => b.onclick = () => ACT[b.dataset.act]());
  panel.querySelectorAll('[data-zoom]').forEach(im => im.onclick = () => { lb.querySelector('img').src = im.src; lb.hidden = false; });
  panel.querySelectorAll('[data-zoomsrc]').forEach(b => b.onclick = () => { lb.querySelector('img').src = b.dataset.zoomsrc; lb.hidden = false; });
  bindTerms(panel); refreshTries();
}

/* ============ Cards ============ */
const cardEl = $('#card'), lb = $('#lightbox'); let lastFocus = null;
lb.onclick = () => { lb.hidden = true; };
function openCard(key){ const c = CARDS[key]; if (!c) return; lastFocus = document.activeElement;
  const sheet = cardEl.querySelector('.card-sheet'); sheet.style.setProperty('--c', CH[state.ch].color);
  sheet.innerHTML = `<div class="card-top"><div><div class="eyebrow">${esc(c.kicker)}</div><h3 id="cardTitle">${esc(c.title)}</h3></div><button class="close" aria-label="Close card">×</button></div>
    <div class="card-body">${key === 'boltzmann' ? fig(['img/bb/boltzmann.jpg','Ludwig Boltzmann (public domain). From your slides.'], true) : ''}${c.body.map(p => `<p>${esc(p)}</p>`).join('')}
      <details class="refs" open><summary>Sources</summary><ol>${(c.refs||[]).map(r => `<li>${esc(REFS[r]||r)}</li>`).join('')}</ol></details></div>`;
  cardEl.hidden = false; sheet.scrollTop = 0; sheet.querySelector('.close').onclick = closeCard; sheet.querySelector('.close').focus(); }
function closeCard(){ cardEl.hidden = true; if (lastFocus && lastFocus.isConnected) lastFocus.focus(); }
cardEl.addEventListener('click', e => { if (e.target === cardEl) closeCard(); });
function bindTerms(root){ root.querySelectorAll('.term,[data-card]').forEach(t => t.onclick = e => { e.stopPropagation(); openCard(t.dataset.card); }); }
addEventListener('keydown', e => { if (e.key === 'Escape'){ if (!lb.hidden) lb.hidden = true; else if (!cardEl.hidden) closeCard(); }
  if (state.ch === 'hard' && cardEl.hidden && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) goStop(state.stop + (e.key === 'ArrowRight' ? 1 : -1)); });

/* ============ Loop ============ */
let last = performance.now();
function frame(now){ const dt = Math.min(0.05, (now - last)/1000); last = now; T += dt;
  if (tween){ const k = Math.min(1, (now - tween.t0)/tween.dur), e = k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3)/2;
    camera.position.lerpVectors(tween.from, tween.to, e); controls.target.lerpVectors(tween.tf, tween.tt, e); if (k >= 1) tween = null; }
  controls.update(); updScene(dt); drawHud(); renderer.render(scene, camera); placeTags(); requestAnimationFrame(frame); }
resize(); renderPanel();
{ const [d, dir] = STOP_VIEW[0]; camera.position.copy(stopGroups[0].position.clone().add(dir.clone().normalize().multiplyScalar(d*(isNarrow() ? 1.35 : 1)))); controls.target.copy(stopGroups[0].position); }
loadCortex().catch(e => console.warn(e)).finally(() => { const l = $('#loading'); if (l) l.remove(); });
requestAnimationFrame(frame);

</script>
