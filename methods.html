<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Methods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: the 3D brain is the test bench; each method attaches its hardware to it. Live readout bottom-left, study notes docked right; bottom sheet on phones. */
:root{
  color-scheme: dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0b0e14; --bg-2:#141a27; --panel:#11151e; --raise:#1a2030; --line:#283044;
  --fg:#eceef4; --muted:#a3abbc; --faint:#6e7689; --chalk:#f4d27a;
  --na:#ffb547; --k:#a58bff; --ca:#5fe0a3; --nt:#ff6fa5; --light:#7ad7ff; --hot:#ff7a59;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --panel-w:460px;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}

#stage{position:fixed;inset:0;background:radial-gradient(ellipse 75% 70% at 38% 42%,var(--bg-2) 0%,var(--bg) 72%)}
#stage canvas{display:block;touch-action:none;cursor:grab}
#stage canvas.hovering{cursor:pointer}

.brand{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:20px;z-index:5;pointer-events:none}
.home-link{pointer-events:auto;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.home-link:hover{color:var(--fg)}
.brand-sub{font-size:13px;font-weight:600;color:#ffd166;margin-top:2px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:2px 0 0}

/* scenario chips */
.chips{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);right:calc(var(--panel-w) + 16px);left:300px;z-index:5;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(17,21,30,.78);backdrop-filter:blur(6px);cursor:pointer;font-size:13.5px;white-space:nowrap}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--c,var(--chalk));background:color-mix(in srgb,var(--c,var(--chalk)) 24%,rgba(17,21,30,.9));font-weight:700}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--chalk))}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(17,21,30,.78);backdrop-filter:blur(6px)}
.seg button{border:0;background:none;padding:7px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--chalk);color:#16130a;font-weight:700}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 106px);left:20px;max-width:340px;z-index:5;background:rgba(17,21,30,.92);border:1px solid var(--line);border-left:3px solid var(--c,var(--chalk));border-radius:0 10px 10px 0;padding:10px 12px;font-size:13.5px;color:var(--fg);backdrop-filter:blur(6px)}
.toast b{display:block;font-family:var(--f-display);font-size:15px;margin-bottom:2px}
.toast .term{margin-top:4px;display:inline-block}

/* lab instruments */
.lab{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:5;width:min(420px,calc(100vw - var(--panel-w) - 40px));background:rgba(15,19,28,.9);border:1px solid var(--line);border-radius:14px;padding:14px 16px;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:10px}
.lab-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.readout{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.readout small{font-size:15px;color:var(--muted);font-weight:600;margin-left:3px}
.phase{font-size:13px;color:var(--muted);min-height:20px}
.phase b{color:var(--fg)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.slider-row{display:flex;align-items:center;gap:10px}
input[type=range]{flex:1;accent-color:var(--chalk);height:28px;margin:0}
.btn{padding:9px 15px;border-radius:9px;border:1px solid var(--line);background:var(--raise);cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--chalk);color:#16130a;border-color:var(--chalk)}
.btn.small{padding:6px 11px;font-size:13px}
.states{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.state{padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--faint)}
.state.on{color:#16130a;font-weight:700}
.state.closed.on{background:#8ea3c4}.state.open.on{background:var(--na)}.state.inact.on{background:#ff8f8f}
.state.k.on{background:var(--k)}
#trace{width:100%;height:120px;display:block;border-radius:8px;background:#0b0e14}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}

.mimage{position:fixed;right:calc(var(--panel-w) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:5;width:300px;background:rgba(15,19,28,.9);border:1px solid var(--line);border-radius:14px;padding:12px 14px;backdrop-filter:blur(8px)}
.mimage canvas{width:100%;height:auto;display:block;border-radius:8px;margin-top:6px}
.mimage .cap{font-size:12.5px;color:var(--muted);margin-top:6px}
.mimage h4{margin:2px 0 0;font-family:var(--f-display);font-size:16px}

/* labels on the neuron */
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.plabel{width:max-content;position:absolute;left:0;top:0;transform:translate(-50%,-140%);font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:6px;background:rgba(11,14,20,.85);border:1px solid var(--line);white-space:nowrap;pointer-events:none;transition:opacity .2s}
.plabel.hot{border-color:var(--chalk);color:var(--chalk)}
.plabel.ion{font-weight:400;font-family:var(--f-mono);font-size:11.5px}

/* panel */
#panel{box-sizing:border-box;position:fixed;top:0;right:0;bottom:0;width:var(--panel-w);background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;z-index:6;padding:calc(env(safe-area-inset-top,0px) + 24px) 26px calc(env(safe-area-inset-bottom,0px) + 26px);display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
#panel h2{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.015em;margin:4px 0 0;text-wrap:balance}
#panel p{margin:0;color:var(--fg);max-width:62ch}
#panel .lead{color:var(--muted)}
.topic-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.topic-btn{width:100%;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--raise);cursor:pointer}
.topic-btn:hover{border-color:var(--c)}
.topic-btn .k{font-family:var(--f-mono);font-size:11px;color:var(--c);letter-spacing:.06em}
.topic-btn b{font-family:var(--f-display);font-size:17px}
.back{align-self:flex-start;background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:14px}
.back:hover{color:var(--fg)}
.topic-head .eyebrow{color:var(--c)}
.blist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.blist li::marker{color:var(--c)}
.figure{margin:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;display:flex;flex-direction:column;gap:8px}
.figure img{display:block;width:100%;border-radius:7px;cursor:zoom-in;background:#fff}
.figure.narrow img{width:auto;max-height:300px;margin:0 auto}
.figure figcaption{font-size:12.5px;color:var(--muted)}
.mn{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mn-title{padding:8px 12px;background:color-mix(in srgb,var(--c) 18%,var(--raise));font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.mn-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.mn-row .L{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;color:var(--c);text-align:center}
.mn-row b{font-family:var(--f-display);font-size:16px}
.mn-row .mem{display:block;color:var(--chalk);font-weight:700;font-size:14px}
.mn-row .det{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.pairs{display:grid;grid-template-columns:minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pairs div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.pairs div:first-child{border-top:0}
.see3d{display:inline-block;margin-top:4px;background:none;border:0;padding:0;color:var(--c,#f4d27a);font:inherit;font-weight:700;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.pairs dt{color:var(--muted);margin:0}.pairs dd{margin:0}
.tries{display:flex;flex-wrap:wrap;gap:8px}
.try{border:1px dashed var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);color:var(--fg);padding:8px 13px;border-radius:9px;cursor:pointer;font-weight:700;font-size:13.5px}
.try:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}
.parts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.part{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--raise)}
.part b{display:block;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.part:hover,.part:focus-visible{border-color:var(--c)}
.part[aria-pressed="true"]{border-color:var(--chalk);background:color-mix(in srgb,var(--chalk) 14%,var(--raise))}
.case{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;cursor:pointer;border-left:3px solid var(--c);padding:10px 12px;background:rgba(0,0,0,.22);border-radius:0 8px 8px 0;font-size:14px}
.case:hover,.case:focus-visible{background:color-mix(in srgb,var(--c) 14%,rgba(0,0,0,.2))}
.case .eyebrow{color:var(--c)}
.go-card{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--fg);border:1px solid var(--c);border-radius:10px;padding:12px 14px;background:color-mix(in srgb,var(--c) 14%,var(--raise))}
.go-card b{font-family:var(--f-display);font-size:17px}
.go-card:hover{background:color-mix(in srgb,var(--c) 24%,var(--raise))}
.case-go{font-size:12.5px;color:var(--c);font-weight:700;margin-top:2px}
.qa{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.qa .q{font-weight:700}
.qa .a{color:var(--muted);font-size:14px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px}
.note{font-size:12.5px;color:var(--faint)}
.term{all:unset;cursor:pointer;font-weight:700;border-bottom:2px solid var(--c,var(--chalk));padding:0 1px;border-radius:2px;background:color-mix(in srgb,var(--c,var(--chalk)) 14%,transparent)}
.term:hover,.term:focus-visible{background:color-mix(in srgb,var(--c,var(--chalk)) 30%,transparent)}

/* cards */
#card[hidden]{display:none}
#card{position:fixed;inset:0;right:var(--panel-w);z-index:8;display:grid;place-items:center;padding:24px;background:rgba(8,10,14,.55);backdrop-filter:blur(3px)}
.card-sheet{width:min(640px,100%);max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);overscroll-behavior:contain}
.card-top{position:sticky;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 12px;background:var(--panel);border-bottom:1px solid var(--line);z-index:1}
.card-top .eyebrow{color:var(--c)}
.card-top h3{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;margin:3px 0 0;text-wrap:balance}
.close{flex:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--raise);cursor:pointer;font-size:20px;line-height:1}
.card-body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px}
.cfig{margin:0;border-radius:10px;overflow:hidden;border:1px solid var(--line)}.cfig svg{display:block;width:100%;height:auto}.cfig figcaption{font-size:13px;color:var(--muted);padding:8px 12px}
.card-body p{margin:0;max-width:62ch}
.refs{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.refs summary{cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.refs ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
#lightbox[hidden]{display:none}
#lightbox{position:fixed;inset:0;background:rgba(5,7,10,.94);z-index:12;display:grid;place-items:center;padding:24px;cursor:zoom-out}
#lightbox img{max-width:100%;max-height:100%;border-radius:10px;object-fit:contain;background:#fff}
#loading{position:fixed;left:0;right:var(--panel-w);top:46%;text-align:center;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);z-index:1}

.plabel.big{font-size:15px;padding:4px 11px}
.plabel .eyebrow{font-size:10px}
.scene-hud{display:none}
#panel > *{flex-shrink:0}
body[data-scene="bump"] .lab-only, body[data-scene="membrane"] .lab-only{display:none!important}
body[data-scene="membrane"] #memHud, body[data-scene="bump"] #bumpHud{display:flex}
.hud-row{display:flex;flex-wrap:wrap;gap:8px}
.hud-btn{padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--raise);cursor:pointer;font-weight:700;font-size:13.5px}
.hud-btn[aria-pressed="true"]{background:var(--c,var(--chalk));color:#16130a;border-color:var(--c,var(--chalk))}
.hud-btn:hover{border-color:var(--muted)}
.bump-pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bump-pick button{padding:8px 4px;border-radius:9px;border:1px solid var(--line);background:var(--raise);cursor:pointer;text-align:center}
.bump-pick b{display:block;font-family:var(--f-display);font-size:24px;line-height:1;color:var(--c)}
.bump-pick span{font-size:11.5px;color:var(--muted)}
.bump-pick button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--raise))}
.mn-pick{all:unset;box-sizing:border-box;cursor:pointer;width:100%}
.mn-pick:hover .mn-row,.mn-pick:focus-visible .mn-row{background:color-mix(in srgb,var(--c) 10%,transparent)}
.mn-pick[aria-pressed="true"] .mn-row{background:color-mix(in srgb,var(--c) 18%,transparent)}
.mn-hint{font-size:12px;color:var(--faint);padding:6px 12px;border-top:1px solid var(--line)}
@media (max-width:1180px){ .mimage{display:none} }
@media (max-width:820px){
  :root{--panel-w:0px}
  #panel{width:auto;top:auto;left:0;height:46%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 20px)}
  #panel h2{font-size:24px}
  .brand h1{font-size:17px}
  .chips{left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 58px);flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-bottom:4px}
  .toast{display:none}
  .lab{left:10px;right:10px;width:auto;bottom:calc(46% + 8px);padding:10px 12px;gap:7px}
  #trace,.states{display:none}
  .phase{font-size:12.5px}
  .readout{font-size:26px}
  .legend{display:none}
  #card{right:0;padding:0} .card-sheet{border-radius:0;height:100%;max-height:none}
  .pairs div{grid-template-columns:110px minmax(0,1fr)}
  .parts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hud{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:5;width:min(520px,calc(100vw - var(--panel-w) - 40px));background:rgba(15,19,28,.92);border:1px solid var(--line);border-radius:14px;padding:12px 14px;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:8px}
#hudCanvas{width:100%;height:auto;display:block;border-radius:8px}
#hudText{font-size:13.5px;color:var(--muted);min-height:40px}
#hudText b{color:var(--fg)}
.plabel{width:max-content}
.plabel.elec{font-family:var(--f-mono);font-size:10.5px;padding:1px 5px;font-weight:500;background:rgba(11,14,20,.75)}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.mbtn{width:100%;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;padding:10px 13px;border-radius:10px;border:1px solid var(--line);background:var(--raise);cursor:pointer}
.mbtn:hover,.mbtn:focus-visible{border-color:var(--c)}
.mbtn .mn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#0b0e14;font-family:var(--f-display);font-weight:800;font-size:16px}
.mbtn b{display:block;font-family:var(--f-display);font-size:16.5px}
.mbtn span span{display:block;font-size:12.5px;color:var(--muted)}
.rw{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;white-space:nowrap}
.rw::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--k)}
.rwkey{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.chart svg{width:100%;height:auto;display:block}
.chart .pt{cursor:pointer}
.chart .pt:hover text,.chart .pt:focus text{fill:var(--chalk)}
.chart{background:var(--bg)}
.long{color:var(--muted);font-size:14px;margin-top:2px}
.mem-line{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--chalk);line-height:1.3}
.specs dt{color:var(--muted)}
.cases{display:flex;flex-direction:column;gap:8px}
.try[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 30%,transparent);border-style:solid}
.quiz{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--raise)}
.quiz .q{font-weight:700;margin:0}
.qopts{display:flex;flex-wrap:wrap;gap:6px}
.qopt{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700;font-size:13px}
.qopt:hover:not(:disabled){border-color:var(--chalk)}
.qopt[aria-pressed="true"]{background:var(--chalk);color:#16130a}
.qfb{margin:0;font-size:14px}
.qfb.ok{color:#5fe0a3}.qfb.bad{color:#ffb0a0}
.fm{border:1px solid var(--c);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--c) 8%,var(--raise))}
.fm-steps{display:flex;flex-direction:column;gap:6px}
.fms{padding:8px 10px;border-radius:8px;border:1px solid var(--line);opacity:.45;font-size:13.5px}
.fms b{display:block}
.fms.on{opacity:1;border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.fms.done{opacity:.75}
#panel a{color:var(--chalk)}

/* ============ Methods (from Professor Freed's Methods deck) ============
   rw: 'read' records activity, 'write' changes it, 'both', 'history'.  inv: invasiveness 0–3.
   t / s: log10 of temporal resolution (seconds) and spatial resolution (mm) for the chart. */
const METHODS = [
  { id:'lesion', n:'0', title:'Brain damage & autopsy', short:'Damage', rw:'history', inv:0, color:'#c9a27a', t:5.5, s:1.2,
    tag:'Where it all started',
    analogy:'Figure out what a part does by seeing what goes missing when it breaks.',
    demos:[['Show Tan’s damage (Broca’s area)','tan'],['Show Gage’s damage (iron rod)','gage'],['Remove a hemisphere','hemi']],
    points:[
      'Before scanners, we learned how the brain works from damage: what changed when part of it was hurt.',
      '[[gage|Phineas Gage]] (1848) survived an iron rod through his frontal lobes; reported personality changes linked those regions to judgment and behavioral control.',
      'Autopsies connected damage to symptoms during life. Paul Broca (1861) studied [[tan|patient “Tan,”]] who understood speech but could only say “tan,” linking the left frontal lobe to speech production.',
      'Experimental lesions: researchers deliberately damaged or removed brain areas in animals, then watched what changed in movement, sensation or behavior.',
      'Electrical stimulation: Fritsch and Hitzig (1870) stimulated a dog’s cortex and caused movements on the opposite side of the body.',
      'Microscopy and staining: Golgi’s stain made single nerve cells visible, and Ramón y Cajal argued that neurons are separate cells.',
      'Early electrical recordings: Hans Berger recorded the first human EEG in 1924.',
      'An early wrong turn: [[phrenology|phrenology]] claimed skull bumps revealed personality. Wrong, but it got people asking whether different regions do different jobs.'],
    cases:[['hemispherectomy','Some children can function with one hemisphere']] },
  { id:'tms', n:'1', title:'TMS', long:'Transcranial magnetic stimulation', short:'TMS', rw:'write', inv:0, color:'#ffb547', t:-1, s:1.1,
    tag:'Stimulates · non-invasive',
    analogy:'A magnet outside your head makes a tiny electric current inside it.',
    demos:[['Single pulse over motor cortex','tmsMotor'],['rTMS over left DLPFC (depression)','tmsDlpfc'],['Pulse the cerebellum (case study)','tmsCereb']],
    points:[
      'A coil held against the scalp sends brief magnetic pulses. A changing magnetic field induces an electric current in the cortex underneath.',
      'The chain: changing magnetic field → induced current in brain tissue → membrane voltage changes → voltage-gated Na⁺ channels open → neurons fire. (Same physics, reversed, as an electric car motor: current → magnetic field → spinning.)',
      'TMS manipulates brain activity; it does not record it.',
      'Single-pulse TMS maps function: one pulse over the hand area makes your opposite hand twitch. Repetitive TMS (rTMS) delivers trains of pulses with longer-lasting effects.',
      'Research: briefly disrupt an area and see what behavior breaks. Clinical: rTMS over the left dorsolateral prefrontal cortex treats depression; it’s also used for anxiety and chronic pain.',
      'Generally safe with trained staff. Common side effects are scalp discomfort and mild headaches; rarely it can trigger a seizure, especially in people predisposed to them.'],
    cases:[['obe','Out-of-body feelings after cerebellar TMS']] },
  { id:'eeg', n:'2', title:'EEG', long:'Electroencephalography', short:'EEG', rw:'read', inv:0, color:'#7ad7ff', t:-2.5, s:1.4,
    tag:'Records · non-invasive',
    analogy:'Microphones outside the stadium: you hear the crowd, not any one person.',
    demos:[['Deep sleep','eegDelta'],['Drowsy','eegTheta'],['Relaxed, eyes closed','eegAlpha'],['Alert','eegBeta'],['Focused','eegGamma']],
    points:[
      '16 to 256 electrodes sit on the scalp in the standard [[1020|10–20 system]]. Letters name the region (Fp, F, C, P, T, O); odd numbers are left, even are right, and “z” is the midline.',
      'EEG does not record single neurons or action potentials. It records the summed, synchronized graded potentials ([[psp|EPSPs and IPSPs]]) of thousands to millions of pyramidal neurons, mostly in cortical layers III and V.',
      'Why pyramidal neurons? They’re long, straight and lined up perpendicular to the scalp, so their [[dipole|dipoles]] stack like batteries. Randomly oriented neurons cancel out.',
      'Signals are tiny: about 10–100 microvolts at the scalp, around 1,000 times smaller than the millivolts inside a neuron.',
      'High temporal resolution (milliseconds), poor spatial resolution. Non-invasive, cheap and portable.',
      'Hertz = cycles per second. Alpha ≈ 10 Hz means the voltage pattern rises and falls about 10 times every second.'],
    mn:{title:'Brain waves: D-T-A-B-G', rows:[['δ','Delta 0.5–4 Hz','D = Deep sleep'],['θ','Theta 4–8 Hz','T = Twilight (drowsy)'],['α','Alpha 8–13 Hz','A = At ease (relaxed, eyes closed)'],['β','Beta 13–30 Hz','B = Busy brain (alert)'],['γ','Gamma 30+ Hz','G = Gathering information (focused)']]},
    cases:[['hyperscan','Couples’ brains sync up'],['alpha','Alpha waves and focus']] },
  { id:'ecog', n:'3', title:'ECoG & microelectrode arrays', short:'ECoG', rw:'both', inv:3, color:'#5fe0a3', t:-3, s:0.3,
    tag:'Records (and can stimulate) · invasive',
    analogy:'ECoG = microphones on the stadium roof. A microelectrode array = a microphone next to each fan.',
    demos:[['Record with the ECoG grid','ecogRec'],['Record spikes with a Utah array','utah'],['Stimulate: map before surgery','penfield']],
    points:[
      'ECoG (electrocorticography) places a grid or strip of electrodes directly on the cortex, under the skull. That requires a craniotomy.',
      'It records local field potentials: summed synaptic activity and rhythms from millions of neurons per electrode. Much better spatial resolution and signal than EEG, with the same millisecond timing.',
      'Microelectrode arrays like the Utah array have about 100 tiny needles that go 1–1.5 mm into cortex and record action potentials from single neurons or small groups.',
      'They answer different questions. ECoG: which region is active, and what rhythm dominates? Arrays: which neuron fired, and what does it encode?',
      'The same electrodes can sometimes stimulate. Now the microphone has become a loudspeaker, sending something back in.',
      'Awake surgery is possible because brain tissue has no ordinary pain receptors, so the patient can help surgeons map language and movement: if stimulation stops your speech, “DON’T CUT HERE.”'],
    cases:[['penfield','Touch the brain and a memory appears'],['painbutton','There’s no simple “pain button”'],['handwriting','Typing by imagining handwriting']] },
  { id:'dbs', n:'4', title:'DBS', long:'Deep brain stimulation', short:'DBS', rw:'write', inv:3, color:'#ff8f6b', t:-2.2, s:0.4,
    tag:'Stimulates · invasive, implanted',
    analogy:'A pacemaker for the brain.',
    demos:[['Parkinson’s: stimulate the STN','dbsPD'],['Essential tremor: stimulate the Vim','dbsET'],['Turn stimulation off','dbsOff']],
    points:[
      'Electrodes are implanted deep in the brain, in targets like the thalamus, subthalamic nucleus or globus pallidus, and wired to a pulse generator under the skin of the chest.',
      'It treats Parkinson’s disease, essential tremor and dystonia. A clinician adjusts the intensity and frequency from outside.',
      'Unlike lesion surgery, DBS is reversible: turn it off, or remove the device. It manages symptoms; it doesn’t cure the disease.',
      'Therapeutic modulation, not mind reading. Compare ECoG, which records from the surface to monitor and map.',
      'Why does it work? Leading ideas: it jams the abnormal synchronized signals, replaces chaotic rhythms with a steady high-frequency pace, quiets overactive neurons (like a removable lesion), or drives output fibers to override glitching cells.'],
    pairs:[['Parkinson’s','Target: STN or GPi. Stops resting tremor, plus stiffness and slowness. Often lets patients cut dopamine medication about in half.'],['Essential tremor','Target: Vim of the thalamus. Stops action tremor (when moving or holding a position). Treats only the shaking.']],
    cases:[] },
  { id:'fmri', n:'5', title:'fMRI', long:'Functional magnetic resonance imaging', short:'fMRI', rw:'read', inv:0, color:'#ff6fa5', t:0.3, s:0.4,
    tag:'Records (blood flow) · non-invasive',
    analogy:'A marching band: protons are marchers, deoxygenated blood is potholes. Fewer potholes, more in step, stronger signal.',
    demos:[['Tap your right fingers','fmriMotor'],['Look at faces','fmriFaces'],['Look at houses','fmriHouses'],['Analyze without correcting for multiple comparisons','salmon']],
    points:[
      'MRI tracks hydrogen protons, mostly in water. A strong magnet lines them up; a radio pulse knocks them over; as they relax back they give off a signal. [[t1t2|T1 vs. T2]] images weight that relaxation differently.',
      'Active areas get a rush of fresh, oxygen-rich blood, more than they use. Deoxygenated hemoglobin is slightly magnetic and makes the field “lumpy”; flushing it out makes the field smoother, so the signal gets stronger. That’s the [[bold|BOLD signal]].',
      'fMRI measures blood oxygenation, not neural firing directly. The BOLD response peaks about 4–6 seconds after the activity and is back to baseline by 10–12 seconds.',
      'It takes a whole-brain picture every 1–3 seconds. Each [[voxel|voxel]] (a 3D pixel, about 2–3 mm wide) contains hundreds of thousands to millions of neurons.',
      'High spatial resolution, poor temporal resolution. Non-invasive, no radiation, but loud, cramped and very sensitive to head movement.',
      'Signal changes are tiny: about 1–5%. That’s why fMRI needs lots of averaging and careful statistics. Try the last button to see what happens without them.',
      'Most scanners run at 1.5–3 tesla: about 30,000–60,000 times Earth’s magnetic field and roughly 1,500–3,000 times a fridge magnet.'],
    cases:[['salmon','The dead salmon'],['fmriproblems','Why fMRI results can mislead']] },
  { id:'pet', n:'6', title:'PET', long:'Positron emission tomography', short:'PET', rw:'read', inv:1, color:'#ffd166', t:2, s:0.7,
    tag:'Records (metabolism) · injected tracer',
    analogy:'Follow the sugar: the busiest regions grab the most radioactive glucose.',
    demos:[['Inject FDG','petInject'],['Subtraction: faces − blank wall','petSub']],
    points:[
      'A radioactive tracer is injected, usually FDG (fluorodeoxyglucose), a glucose look-alike tagged with fluorine-18. It gets taken up like glucose but can’t be fully broken down, so it builds up where cells are busiest.',
      'After a 30–60 minute uptake period, you lie in a ring of detectors.',
      'The tracer emits a [[positron|positron]], the electron’s antimatter partner. It meets an electron and both annihilate into two gamma photons flying in opposite directions. Detecting both at once pinpoints where it happened.',
      'Tumors often burn glucose fast even with oxygen around (the Warburg effect), so they show up as hot spots.',
      'Subtraction analysis: scan during a control condition (gazing at a blank wall) and during a task (gazing at faces), then subtract to isolate the task-related regions.'],
    cases:[['murderers','The “41 murderers” study'],['schizo','Hypofrontality in schizophrenia']] },
  { id:'opto', n:'7', title:'Optogenetics', short:'Opto', rw:'write', inv:3, color:'#4cc9f0', t:-2.7, s:-1.6,
    tag:'Stimulates or silences · genetic + implanted light',
    analogy:'The virus is the delivery truck. The promoter is the lock. Only the right cell has the key.',
    demos:[['Blue light on channelrhodopsin','optoBlue'],['Yellow light on halorhodopsin','optoYellow'],['Run the false-memory experiment','falseMem']],
    points:[
      'Opto = light, genetics = genes. Scientists borrow light-sensitive proteins (opsins) from algae and other microbes and put them into specific neurons, usually in mice.',
      'Channelrhodopsin (ChR2) is a light-gated cation channel: blue light (about 480 nm) opens it, Na⁺ rushes in, and the neuron fires, time-locked to each flash.',
      'Halorhodopsin (NpHR) is a light-driven chloride pump: yellow light drives Cl⁻ in and silences the neuron.',
      'The massive advantage is [[promoter|cell-type specificity]]. The virus infects many neurons, but only cells with the right promoter (or Cre enzyme) switch the gene on. That avoids electrical stimulation’s problem of activating everything near the electrode.',
      'Two ways in: viral delivery (precise, works in adults) or transgenic breeding (stable, consistent). “Viruses give you precision, breeding gives you permanence.”',
      'Limits: it needs surgery for optic fibers, light doesn’t go deep into tissue, and foreign proteins can trigger an immune response. Newer [[wireless|wireless implants]] free the animal to move.'],
    cases:[['falsememory','Creating a false fear memory'],['wireless','Wireless optogenetics']] },
  { id:'dti', n:'+', title:'DTI', long:'Diffusion tensor imaging', short:'DTI', rw:'read', inv:0, color:'#a58bff', t:3, s:0.3, more:true,
    tag:'Maps wiring · non-invasive',
    analogy:'Water in a cup spreads everywhere; water in a bundle of straws flows along the straws. DTI figures out which way the straws point.',
    demos:[['Show the white-matter tracts','dtiShow']],
    points:[
      'An MRI technique that maps white-matter pathways by measuring how water diffuses.',
      'In gray matter, water wiggles in every direction. Inside axon bundles, it moves mostly along the fibers, not across them.',
      'Anisotropy (“ann-ice-oh-TROPH-ee”): having different properties in different directions, like wood that’s stronger along the grain. Fractional anisotropy (FA) runs from 0 (equal in all directions) to 1 (one direction). High FA means strong, coherent white matter.',
      'A tensor is the 3D math model of that direction at each point. Tracts are usually color-coded: red = left–right, green = front–back, blue = up–down.',
      'You don’t see axons directly; you infer them from water motion. Used to study connectivity and changes in MS, stroke and brain injury.'],
    cases:[] },
  { id:'calcium', n:'+', title:'Calcium imaging', short:'Ca²⁺', rw:'read', inv:3, color:'#7dffa1', t:-1, s:-2, more:true,
    tag:'Records (light) · genetic + optical',
    analogy:'Turn neural activity into light you can film.',
    demos:[['Watch neurons flash','caFlash']],
    points:[
      'Action potentials open voltage-gated Ca²⁺ channels, so Ca²⁺ briefly enters. Instead of recording voltage with electrodes, we film that calcium as fluorescence.',
      'Calcium-sensitive dyes (like Fura-2) soak into neurons: strong signal, but toxic over time and hard to use in a behaving brain.',
      'GCaMP is a genetically encoded indicator, made from GFP plus calmodulin, that glows brighter when Ca²⁺ binds. Like opsins, it can be targeted to specific cell types.',
      'The big advantage: you can see many neurons at once, know exactly where they are, and target specific cell types, which electrodes alone can’t do.',
      'The limit: Ca²⁺ is a proxy for voltage. The signal is slower than spikes and lingers after firing.',
      '[[twophoton|Two-photon imaging]] lets you image hundreds of microns deep with single-cell resolution.'],
    cases:[['zebrafish','Watching a zebrafish decide to hunt']] }
];

const CARDS = {
  gage:{title:'Phineas Gage', kicker:'Brain damage', body:['In 1848 an iron rod shot through railroad foreman Phineas Gage’s head, destroying much of his left frontal lobe. He survived, but his doctor reported he became impulsive and unreliable: “no longer Gage.”','His case suggested the frontal lobes help with judgment and self-control, long before anyone could scan a brain. (See the Frontal Lobe scene in Neuroanatomy.)'], refs:['harlow','damasio']},
  tan:{title:'Patient “Tan”', kicker:'Autopsy', body:['Louis Victor Leborgne understood speech but could only say “tan.” After he died in 1861, Paul Broca found damage in the left frontal lobe.','It was the first widely accepted evidence that a specific ability lives in a specific place. MRI of his preserved brain in 2007 showed the damage reached deeper than Broca could see.'], refs:['broca','dronkers']},
  phrenology:{title:'Phrenology', kicker:'An early wrong turn', fig:'phren', cap:'A phrenology head in the style of 1800s busts: each patch of skull was supposed to hold one trait. None of it held up.', body:['In the early 1800s, Franz Joseph Gall and followers claimed that bumps on the skull revealed traits like kindness or cunning.','The method was invalid: skull shape doesn’t track the brain beneath, and the “faculties” were made up. But the core question, whether different brain regions do different jobs, turned out to be a good one.'], refs:['vanwhy']},
  hemispherectomy:{title:'Living with one hemisphere', kicker:'Neuroplasticity', body:['For severe epilepsy, some children have much of one cerebral hemisphere removed or disconnected (hemispherectomy or hemispherotomy).','The remaining hemisphere can take over an astonishing amount. In one study, childhood hemispherectomy patients recognized words and faces with over 80% accuracy, whichever hemisphere remained, though still below controls.','Lose half your cortex as a child ≠ lose half your mind. Outcomes vary a lot, though.'], refs:['granovetter']},
  obe:{title:'Out-of-body feelings after cerebellar TMS', kicker:'Case study', body:['Out-of-body experiences are usually linked to temporo-parietal regions that combine the senses into a sense of “where my body is.”','In a single-case study, a healthy young woman received TMS over the cerebellum. Afterward she reported illusory own-body perceptions, like floating or being displaced. Fake (placebo) cerebellar TMS and TMS over the occipital lobe didn’t do this.','EEG showed changes over somatosensory cortex. The takeaway: the cerebellum isn’t just “motor”; it may help keep your sense of body-in-space stable. It’s one person, so treat it as a lead, not proof.'], refs:['schutter']},
  '1020':{title:'The 10–20 system', kicker:'EEG', body:['A standard way to place electrodes so recordings can be compared across people and studies. Electrodes sit at 10% or 20% of the distance between four landmarks: the nasion (top of the nose), the inion (bump on the back of the skull), and the points in front of each ear.','Letters: Fp = frontopolar, F = frontal, C = central (motor and somatosensory strip), P = parietal, T = temporal, O = occipital. Odd numbers = left, even = right, z = midline (“zero”).','Anchor points: Fp1/Fp2 prefrontal, F3/F4 frontal, C3/C4 motor (hand area nearby), P3/P4 parietal, O1/O2 visual, and Cz right on top, a common reference. Hover the electrodes on the 3D head to see them.'], refs:['jasper']},
  psp:{title:'EPSPs and IPSPs', kicker:'Graded potentials', body:['Graded potentials are small, local changes in membrane voltage in the dendrites and cell body. Their size depends on the input, and they fade with distance.','EPSP (excitatory): usually from glutamate. Na⁺ flows in, moving the cell toward threshold (−55 mV). IPSP (inhibitory): usually from GABA. Cl⁻ flows in (or K⁺ out), moving it away from threshold.','These graded potentials, summed across huge numbers of aligned neurons, are what EEG picks up, not action potentials. (Try the Na⁺ and Cl⁻ channels in the Neuron Lab.)'], refs:['kandel']},
  dipole:{title:'Dipoles: why EEG can see anything', kicker:'EEG', body:['A dipole is just a + end and a − end, like an AA battery. When synapses on a pyramidal neuron’s dendrite open, current flows in at one spot (a sink) and out somewhere else (a source): a tiny battery.','One neuron is invisible from the scalp. But pyramidal neurons are long, straight and lined up perpendicular to the surface, so when thousands activate together their dipoles stack and the field leaks through brain, skull and scalp. Randomly oriented neurons cancel out.','Stadium analogy: everyone stands and leans forward at once, and from far away you see the wave. EEG is that distant view.'], refs:['nunez']},
  hyperscan:{title:'Couples’ brains sync up', kicker:'Hyperscanning EEG', body:['Hyperscanning records EEG from two or more people at once.','Researchers recorded 104 adults during natural face-to-face conversation, comparing romantic couples with strangers. Couples showed brain-to-brain synchrony in gamma rhythms over temporal-parietal regions; strangers didn’t.'], refs:['kinreich']},
  alpha:{title:'Alpha waves and focus', kicker:'EEG study', body:['Klimesch and colleagues proposed the inhibition–timing hypothesis: alpha rhythms aren’t just “idling.” They control when and where the cortex is allowed to process information.','More synchronized alpha appears to reflect actively holding back distractions so you can focus on your thoughts or actions; when alpha becomes disorganized, that control loosens.'], refs:['klimesch']},
  penfield:{title:'Touch the brain and a memory appears', kicker:'Electrical stimulation', body:['Imagine you’re awake during brain surgery. The surgeon touches your cortex with an electrode, and suddenly you hear music or see a scene from your past. Stimulation stops, the experience stops.','Wilder Penfield saw this in some patients, especially with temporal-lobe stimulation. Did he find where memories are stored? Not exactly: there’s still debate about whether these were real memories or the brain constructing something.','The lasting legacy is mapping: surgeons stimulate while you count, talk or move your hand, and if a spot interferes, they don’t cut there.'], refs:['penfield63']},
  painbutton:{title:'There’s no simple “pain button”', kicker:'Electrical stimulation', body:['Students often expect: motor cortex → move a hand, visual cortex → see light, “pain cortex” → feel pain. Penfield struggled to find any pain center.','A later study analyzed 4,160 stimulations in 164 patients: pain came from only about 1.4% of them, mostly around the posterior insula and parietal operculum. Pain is built by a network, not one spot.'], refs:['mazzola']},
  handwriting:{title:'Typing by imagining handwriting', kicker:'Brain–computer interface', body:['A man paralyzed from the neck down had two microelectrode arrays placed in the hand area of his motor cortex (the “hand knob,” about the size of a small aspirin). He imagined writing letters by hand, over and over, building a library of neural activity for each letter.','A recurrent neural network learned to translate those patterns into text in real time: 94.1% raw accuracy, over 99% with autocorrect, at about 90 characters per minute.','The problem: neural patterns drift because the arrays shift slightly in a living, pulsing brain, so accuracy drops over days and the system needs retraining. Professor Freed’s team trained CNN and RNN models on some of this data and kept accuracy around 95% after 9 days with no retraining (on single letters).'], refs:['willett','maynard']},
  bold:{title:'The BOLD signal, step by step', kicker:'fMRI', body:['1. MRI wants a uniform magnetic field so hydrogen protons spin in step. 2. Deoxygenated hemoglobin is paramagnetic: it makes the field lumpy. 3. Lumpy field → protons fall out of phase → weaker signal.','4. Active neurons trigger an oversupply of oxygen-rich blood, flushing out deoxyhemoglobin. 5. Smoother field → protons stay in phase longer → stronger signal.','That signal change, delayed by seconds, is BOLD (blood-oxygen-level-dependent). It reflects blood, not firing directly.'], refs:['ogawa','logothetis']},
  t1t2:{title:'T1 vs. T2', kicker:'MRI', body:['After the radio pulse, protons relax in two ways. T1 = relaxing back with the magnet (“how fast does a spinning top stand back up?”). T2 = losing sync with each other (“how long do the tops stay in step?”).','T1-weighted images are best for anatomy: fat and white matter look bright, water and fluid (CSF) look dark.','T2-weighted images are best for pathology like swelling, inflammation and tumors. The memory trick: T2 = H₂O. Water is bright on T2.'], refs:['kandel']},
  voxel:{title:'Voxels', kicker:'fMRI', body:['Not a pixel: a voxel, a volumetric pixel, a tiny 3D cube of brain, usually 2–3 mm wide.','Each one holds hundreds of thousands to millions of neurons. So one bright voxel ≠ one neuron firing.'], refs:['logothetis']},
  salmon:{title:'The dead salmon', kicker:'fMRI statistics', body:['Researchers put a dead Atlantic salmon in an fMRI scanner, showed it photos of people in social situations, and “asked” it to judge their emotions. Without correction, the analysis found “significant activation” in the fish’s brain.','How? The scanner always measures something: thermal noise from the electronics, and protons that still respond to magnets in dead tissue. Test 20,000 voxels at p < .05 and about 1,000 will look significant by pure chance.','Once they corrected for multiple comparisons, the activation vanished. “The dead fish didn’t have brain activity, it had bad statistics.” The study won an Ig Nobel Prize.'], refs:['bennett']},
  fmriproblems:{title:'Why fMRI results can mislead', kicker:'fMRI', body:['Multiple comparisons: testing 100,000 voxels creates thousands of false positives unless you correct (Bonferroni: very strict; FDR: allows ~5% false discoveries; cluster-based: keep only clusters too big to be chance).','Small samples: costly scanning led to studies with 15–30 people, which inflates false discoveries and exaggerates effect sizes.','Software assumptions: one analysis found common cluster methods could push false-positive rates as high as 70%.','Analytical flexibility: dozens of processing choices mean different teams can reach different conclusions from the same data. Double dipping: picking voxels because they lit up, then measuring the effect in those same voxels, manufactures strong results.'], refs:['eklund','button','kriegeskorte']},
  positron:{title:'Positrons and annihilation', kicker:'PET', body:['A positron has the same mass as an electron but a positive charge: it’s the electron’s antimatter partner, not just an electron with a plus sign.','The tracer emits a positron, which travels a tiny distance, meets an electron, and the two annihilate, turning their mass into two 511 keV gamma photons flying in nearly opposite directions.','Detectors on opposite sides of the ring catch both at the same instant (coincidence detection), so the scanner knows the event happened somewhere on the line between them. Millions of lines build the image.'], refs:['kandel']},
  murderers:{title:'The “41 murderers” study', kicker:'PET case file', body:['Adrian Raine and colleagues PET-scanned 41 people charged with murder who were pleading not guilty by reason of insanity, and 41 matched controls.','The murder group showed lower glucose metabolism in the prefrontal cortex, plus other differences.','BUT: you cannot PET-scan someone and determine that they’re a murderer. A group difference ≠ individual destiny.'], refs:['raine']},
  schizo:{title:'Hypofrontality in schizophrenia', kicker:'PET study', body:['A meta-analysis combined 36 FDG-PET studies (1,335 people). Glucose metabolism in the frontal cortex was lower in schizophrenia than in controls, with large effect sizes, and lower in chronic than first-episode patients.','There wasn’t consistent evidence for changes in other regions. The findings support the “hypofrontality” hypothesis.'], refs:['townsend']},
  promoter:{title:'How opsins reach only certain neurons', kicker:'Optogenetics', body:['Big misconception: “the virus only infects inhibitory neurons.” Viruses like AAV infect many neurons near the injection, sometimes glia too.','The trick is the promoter packaged with the opsin gene. A GAD promoter is only active in GABA (inhibitory) neurons; TH in dopamine neurons; CaMKIIα mostly in excitatory pyramidal neurons. The gene gets in everywhere but only turns on in the right cells.','Cre–lox is even cleaner: use a mouse that makes Cre only in one cell type, inject a Cre-dependent (“floxed”) opsin, and only those cells express it. Retrograde viruses injected into a target travel backward along axons, labeling only neurons that project there.'], refs:['boyden','zhang']},
  falsememory:{title:'Creating a false fear memory', kicker:'Optogenetics', body:['1. A mouse explores Room A, and the hippocampal cells active there are genetically tagged with channelrhodopsin. Nothing scary happens.','2. In Room B, light reactivates the Room A memory cells while the mouse gets a mild foot shock.','3. Back in Room A, the mouse freezes in fear, even though nothing bad ever happened there.','This is how optogenetics moves us from correlation toward causation: turning specific cells on changed what the animal remembered.'], refs:['ramirez']},
  wireless:{title:'Wireless optogenetics', kicker:'Optogenetics', body:['Optic fibers tether the animal. Researchers built a wireless implant small enough (20 mg, 10 mm³) to fit entirely under the skin, powered by radio frequency, heating tissue less than 1 °C.','It allowed light control of the brain, spinal cord and peripheral nerves while mice behaved naturally.'], refs:['montgomery']},
  twophoton:{title:'Two-photon imaging', kicker:'Calcium imaging', body:['The molecule needs $10 to get excited. One-photon gives it a $10 bill; two-photon gives it two $5 bills at the exact same instant.','A single pulsed infrared laser is focused so tightly that, only at the focal point, two low-energy photons hit the same molecule within femtoseconds. Outside that spot it almost never happens.','Result: glow from a tiny 3D volume only, deep penetration (hundreds of microns), less damage, and single-cell, even dendrite-level, resolution.'], refs:['denk','chen']},
  zebrafish:{title:'Watching a zebrafish decide to hunt', kicker:'GCaMP', body:['Zebrafish larvae are transparent, so researchers can image the whole brain at once.','When a larva sees prey, a flash of green calcium activity starts in visual areas and travels toward motor areas as the fish “decides” to hunt: sensory input turning into a motor command across a whole vertebrate brain.'], refs:['muto']}

/* ============ Brain material: tissue + glowing blobs (optionally voxelized) + false-positive noise ============ */
const NB = 8;
const U = {
  uBlob:{value:Array.from({length:NB}, () => new THREE.Vector4(0,0,0,0.1))},
  uBlobC:{value:Array.from({length:NB}, () => new THREE.Color())},
  uBlobA:{value:new Array(NB).fill(0)},
  uVox:{value:0}, uNoise:{value:0}, uTime:{value:0}, uAlpha:{value:1},
  uLes:{value:[new THREE.Vector4(0,0,0,0.1), new THREE.Vector4(0,0,0,0.1)]}, uLesA:{value:0},
  uTissue:{value:lin('#d9b2a4')}
};
function brainMat(){
  const m = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.62});
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, U);
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nattribute float curv; varying float vCurv; varying vec3 vPos;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvPos = position; vCurv = curv;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
varying float vCurv; varying vec3 vPos;
uniform vec4 uBlob[${NB}]; uniform vec3 uBlobC[${NB}]; uniform float uBlobA[${NB}];
uniform float uVox; uniform float uNoise; uniform float uTime; uniform float uAlpha;
uniform vec4 uLes[2]; uniform float uLesA; uniform vec3 uTissue;
float h3(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,45.164)))*43758.5453); }`)
    .replace('vec4 diffuseColor = vec4( diffuse, opacity );', `
float ao = mix(0.5, 1.06, smoothstep(-0.75, 0.6, vCurv));
vec3 col = uTissue*ao; vec3 glow = vec3(0.0);
vec3 q = uVox > 0.0 ? (floor(vPos/uVox) + 0.5)*uVox : vPos;
for (int i=0;i<${NB};i++){
  float d = length(q - uBlob[i].xyz);
  float w = (1.0 - smoothstep(uBlob[i].w*0.55, uBlob[i].w, d)) * uBlobA[i];
  col = mix(col, uBlobC[i]*mix(0.8,1.0,ao), clamp(w,0.0,1.0)); glow += uBlobC[i]*w*0.45;
}
if (uNoise > 0.0){ vec3 vq = floor(vPos/0.045); float r = h3(vq + floor(uTime*1.3)*0.37);
  if (r < uNoise){ vec3 nc = r < uNoise*0.5 ? vec3(1.0,0.25,0.15) : vec3(1.0,0.75,0.1); col = nc; glow += nc*0.4; } }
for (int j=0;j<2;j++){ float d = length(vPos - uLes[j].xyz); float w = (1.0 - smoothstep(uLes[j].w*0.75, uLes[j].w, d))*uLesA; col = mix(col, vec3(0.05,0.025,0.02), w); glow -= glow*w; }
vec4 diffuseColor = vec4(col, opacity*uAlpha);`)
    .replace('vec3 totalEmissiveRadiance = emissive;', 'vec3 totalEmissiveRadiance = emissive + glow;');
  };
  m.customProgramCacheKey = () => 'methods-brain';
  return m;
}
const cortexMat = brainMat();
let lh, rh, cereb, stem;
const brainParts = [];
async function loadCortex(){
  const b64 = (await (await fetch('data/cortex.b64.txt')).text()).trim();
  const bin = atob(b64); const u8 = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
  const buf = u8.buffer, n = 32492, f = 64980; let off = 0; const meshes = [];
  for (let h=0; h<2; h++){
    const pos = new Int16Array(buf, off, n*3); off += n*6;
    const idx = new Uint16Array(buf, off, f*3); off += f*6;
    const curv = new Int8Array(buf, off, n); off += n; off += n;
    const P = new Float32Array(n*3), Cc = new Float32Array(n);
    for (let i=0;i<n;i++){ const v = S(pos[i*3]/300, pos[i*3+1]/300, pos[i*3+2]/300); P[i*3]=v.x; P[i*3+1]=v.y; P[i*3+2]=v.z; Cc[i] = curv[i]/127; }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(P,3)); g.setAttribute('curv', new THREE.BufferAttribute(Cc,1));
    g.setIndex(new THREE.BufferAttribute(new Uint32Array(idx),1)); g.computeVertexNormals();
    const m = new THREE.Mesh(g, cortexMat); scene.add(m); meshes.push(m); brainParts.push(m);
  }
  [lh, rh] = meshes;
  // simple cerebellum + brainstem
  const cg = new THREE.SphereGeometry(1, 120, 90), cp = cg.attributes.position, Cv = new Float32Array(cp.count), ctr = S(0,-62,-33), v = V(0,0);
  for (let i=0;i<cp.count;i++){ v.fromBufferAttribute(cp,i); const fol = Math.sin((v.y*0.9 - v.z*0.45)*58);
    const p = V(v.x*0.6, v.y*(v.y>0?0.24:0.31), v.z*(v.z>0?0.36:0.4)).multiplyScalar(1 + 0.016*fol).add(ctr); cp.setXYZ(i,p.x,p.y,p.z); Cv[i] = fol*0.9; }
  cg.setAttribute('curv', new THREE.BufferAttribute(Cv,1)); cg.computeVertexNormals();
  cereb = new THREE.Mesh(cg, cortexMat); scene.add(cereb); brainParts.push(cereb);
  const sg = new THREE.CylinderGeometry(0.13, 0.1, 0.9, 30); const sc = new Float32Array(sg.attributes.position.count).fill(0.3);
  sg.setAttribute('curv', new THREE.BufferAttribute(sc,1));
  stem = new THREE.Mesh(sg, cortexMat); stem.position.copy(S(0,-32,-45)); stem.rotation.x = 0.35; scene.add(stem); brainParts.push(stem);

function selectMethod(id){ if (stem) stem.visible = cereb.visible = true;
  state.m = id;
  Object.entries(G).forEach(([k, g]) => g.visible = k === id);
  head.visible = ['eeg','tms'].includes(id);
  document.body.dataset.m = id || '';
  // sensible starting demos
  if (id === 'tms' && !TMS.mode) ACT.tmsMotor();
  if (id === 'dbs'){ DBS.on = false; }
  if (id === 'fmri' && !FMRI.task){ FMRI.task = 'motor'; FMRI.t0 = T; }
  if (id === 'ecog' && !ECOG.mode){ ECOG.mode = 'rec'; ECOG.t0 = T; }
  if (id === 'pet' && PET.t0 < 0) PET.t0 = T;

}

/* ============ Per-frame scene updates ============ */
function updScene(dt){
  clearBlobs(); U.uVox.value = 0; U.uNoise.value = 0; U.uLesA.value = 0;
  let alpha = 1;
  const m = state.m;
  if (m === 'lesion'){
    if (LES.gage){ const g = gagePts(); U.uLes.value[0].set(g[0].x, g[0].y, g[0].z, 0.16); U.uLes.value[1].set(g[1].x, g[1].y, g[1].z, 0.26); } else { U.uLes.value[0].set(...S(-50,18,8).toArray(), LES.tan ? 0.24 : 1e-4); U.uLes.value[1].w = 1e-4; } U.uLesA.value = (LES.tan || LES.gage) ? 1 : 0; rod.visible = LES.gage;
  }
  if (rh) rh.visible = !(m === 'lesion' && LES.hemi);
  if (m === 'tms'){
    const last = TMS.pulses.filter(p => p <= T).pop(); const e = last != null ? T - last : 9;
    fieldRings.forEach((r, i) => { const k = clamp((e - i*0.05)/0.35, 0, 1); r.scale.setScalar(0.6 + k*1.4); r.material.opacity = e < 0.5 ? (1-k)*0.9 : 0; });

    if (TMS.mode === 'motor'){ const r = S(-38,-22,62); blob(1, r, 0.1, '#ffb547', 0.25); }
    TAGS.filter(t => t.group === 'tms').forEach((t, i) => t.world.copy(i ? TMS.target.clone().add(V(0.15,-0.12,0.1)) : coil.position.clone().add(V(0,0.18,0))));
  }
  if (m === 'eeg'){ const pulse = 0.5 + 0.5*Math.sin(T*2*Math.PI*BANDS[state.eeg][0]/8);
    electrodes.forEach(e => { e.m.material.emissive.copy(lin('#7ad7ff')); e.m.material.emissiveIntensity = 0.15 + 0.5*pulse*(state.eeg==='alpha' && e.name[0]==='O' ? 1.4 : 1); }); }
  if (m === 'ecog'){
    ECOG.cells.forEach((c, i) => { let a = 0;
      if (ECOG.mode === 'rec') a = 0.5 + 0.5*Math.sin(T*3 + c.ph + c.p.z*6);
      if (ECOG.mode === 'stim') a = c === ECOG.site ? (0.6 + 0.4*Math.sin(T*20)) : 0;
      c.m.material.emissiveIntensity = a*1.2; c.m.material.emissive.copy(lin(ECOG.mode === 'stim' && c === ECOG.site ? '#ffd166' : '#5fe0a3')); });
    if (ECOG.mode === 'stim' && ECOG.site) blob(0, ECOG.site.p, 0.12, '#ffd166', 0.8);
    if (ECOG.mode === 'utah') blob(0, S(-38,-22,62), 0.09, '#5fe0a3', 0.6 + 0.3*Math.sin(T*8));

  if (m === 'dbs'){

    leads.forEach(L => { L.contacts.forEach(c => c.material.emissiveIntensity = DBS.on ? 0.8 + 0.6*Math.sin(T*60) : 0); L.glow.material.opacity = DBS.on ? 0.35 + 0.15*Math.sin(T*12) : 0; });
    TAGS.filter(t => t.group === 'dbs')[1].world.copy(DBS_T[DBS.kind][0]).add(V(0.25,-0.05,0.2));
    TAGS.filter(t => t.group === 'dbs')[1].el.textContent = DBS.kind === 'pd' ? 'Subthalamic nucleus (STN)' : 'Thalamus (Vim)';
  }
  if (m === 'fmri'){
    const e = T - FMRI.t0, hrf = t => t <= 0 ? 0 : Math.pow(t/5, 3)*Math.exp(3*(1 - t/5));
    U.uVox.value = 0.06;
    if (FMRI.salmon) U.uNoise.value = 0.05;
    else { const a = clamp(hrf(e % 20)*1.1, 0, 1);
      if (FMRI.task === 'motor') blob(0, S(-38,-22,58), 0.17, '#ff5a3c', a);
      if (FMRI.task === 'faces'){ blob(0, S(40,-52,-18), 0.15, '#ff5a3c', a); blob(1, S(-40,-52,-18), 0.11, '#ff9a3c', a*0.7); }
      if (FMRI.task === 'houses'){ blob(0, S(28,-42,-10), 0.13, '#ffd166', a); blob(1, S(-28,-42,-10), 0.13, '#ffd166', a); } }
  }
  if (m === 'pet'){
    const e = T - PET.t0, up = clamp(e/12, 0, 1);
    if (PET.sub){ blob(0, S(40,-52,-18), 0.15, '#ffd166', 0.9); blob(1, S(-40,-52,-18), 0.11, '#ffd166', 0.6); }
    else PET_SPOTS.forEach((p, i) => blob(i, p, 0.2, i < 2 ? '#ff5a3c' : '#ffb547', up*(i < 2 ? 0.9 : 0.55)));

        ev.hits[0].position.copy(ev.ha); ev.hits[1].position.copy(ev.hb); ev.hits.forEach(h => h.material.opacity = a2 > 0.18 ? 1 - (a2-0.18)/0.42 : 0);
      } else { ev.l.visible = false; ev.hits.forEach(h => h.material.opacity = 0); }
    });
  }
  if (m === 'opto'){
    alpha = 0.3; const e = T - OPTO.t0;
    const flash = OPTO.color === 'blue' ? ((e % 0.2) < 0.05 ? 1 : 0.15) : OPTO.color === 'yellow' ? 0.75 : 0;
    optoGlow.material.color.copy(lin(OPTO.color === 'yellow' ? '#ffd166' : '#4cc9f0')); optoGlow.material.opacity = flash*0.7;
    hippoMesh.material.emissiveIntensity = OPTO.color === 'blue' ? 0.3 + flash*0.9 : OPTO.color === 'yellow' ? 0.05 : 0.3;
  }
  if (m === 'dti'){ alpha = DTI.shown ? 0.18 : 1; G.dti.children.forEach(c => c.visible = !!DTI.shown); }
  if (m === 'calcium'){ for (let i=0;i<5;i++){ const ph = (T*0.8 + i*0.7) % 3; blob(i, [S(-30,30,30),S(-40,-20,50),S(-20,-80,10),S(-50,-30,0),S(-10,50,10)][i], 0.1, '#7dffa1', ph < 1.2 ? Math.exp(-ph*2.5) : 0); } }
  U.uAlpha.value += (alpha - U.uAlpha.value)*Math.min(1, dt*5);
  const want = U.uAlpha.value < 0.99;

}
function ring(src, d){ // where a ray from src in direction d (xz) hits the radius-2 ring
  const b = src.x*d.x + src.z*d.z, c = src.x*src.x + src.z*src.z - 4; const t = -b + Math.sqrt(b*b - c); return V(src.x + d.x*t, 0, src.z + d.z*t);
}

/* ============ Cards ============ */

  const M = METHODS.find(x => x.id === state.m); const sheet = cardEl.querySelector('.card-sheet'); sheet.style.setProperty('--c', M ? M.color : '#f4d27a');
  sheet.innerHTML = `<div class="card-top"><div><div class="eyebrow">${esc(c.kicker)}</div><h3 id="cardTitle">${esc(c.title)}</h3></div><button class="close" aria-label="Close card">×</button></div>
    <div class="card-body">${c.fig ? `<figure class="cfig">${FIGS[c.fig]}<figcaption>${esc(c.cap||'')}</figcaption></figure>` : ''}${c.body.map(p => `<p>${esc(p)}</p>`).join('')}
      <details class="refs" open><summary>Sources</summary><ol>${(c.refs||[]).map(r => `<li>${esc(REFS[r]||r)}</li>`).join('')}</ol></details></div>`;
  cardEl.hidden = false; sheet.scrollTop = 0; sheet.querySelector('.close').onclick = closeCard; sheet.querySelector('.close').focus();
}
function closeCard(){ cardEl.hidden = true; if (lastFocus && lastFocus.isConnected) lastFocus.focus(); }
cardEl.addEventListener('click', e => { if (e.target === cardEl) closeCard(); });
function bindTerms(root){ root.querySelectorAll('.term,[data-card]').forEach(t => t.onclick = e => { e.stopPropagation(); openCard(t.dataset.card); }); }
addEventListener('keydown', e => { if (e.key === 'Escape'){ if (!cardEl.hidden) closeCard(); else if (state.m) selectMethod(null); } });

/* ============ Resolution chart ============ */
const RW = { read:['#7ad7ff','Records'], write:['#ffb547','Stimulates'], both:['#5fe0a3','Both'], history:['#c9a27a','Damage'] };
function chartSVG(){
  const W = 420, H = 300, x0 = 54, y0 = 16, w = W - x0 - 14, h = H - y0 - 44;
  const tx = t => x0 + (t + 3.5)/(7.5)*w, sy = s => y0 + (1 - (s + 2.5)/(4.5))*h;
  const gx = [[-3,'1 ms'],[-1,'0.1 s'],[0,'1 s'],[1.8,'1 min'],[3.6,'1 hr']], gy = [[-2,'cell'],[-1,'0.1 mm'],[0,'1 mm'],[1,'1 cm'],[2,'brain']];
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Methods by spatial and temporal resolution">`;
  gx.forEach(([t,l]) => g += `<line x1="${tx(t)}" y1="${y0}" x2="${tx(t)}" y2="${y0+h}" stroke="var(--line)"/><text x="${tx(t)}" y="${y0+h+16}" text-anchor="middle" fill="var(--faint)" font-size="10.5" font-family="IBM Plex Mono, monospace">${l}</text>`);
  gy.forEach(([s,l]) => g += `<line x1="${x0}" y1="${sy(s)}" x2="${x0+w}" y2="${sy(s)}" stroke="var(--line)"/><text x="${x0-6}" y="${sy(s)+4}" text-anchor="end" fill="var(--faint)" font-size="10.5" font-family="IBM Plex Mono, monospace">${l}</text>`);
  g += `<text x="${x0 + w/2}" y="${H-6}" text-anchor="middle" fill="var(--muted)" font-size="11.5">How fast it sees changes → slower</text>`;
  g += `<text x="12" y="${y0 + h/2}" text-anchor="middle" fill="var(--muted)" font-size="11.5" transform="rotate(-90 12 ${y0+h/2})">Detail → coarser</text>`;
  METHODS.filter(x => !x.more).forEach(M => { const cx = tx(M.t), cy = sy(M.s), col = RW[M.rw][0];
    const shape = M.inv >= 2 ? `<rect x="${cx-8}" y="${cy-8}" width="16" height="16" transform="rotate(45 ${cx} ${cy})" fill="${col}"/>` : `<circle cx="${cx}" cy="${cy}" r="8.5" fill="${col}"/>`;
    g += `<g class="pt" data-m="${M.id}" tabindex="0" role="button" aria-label="${esc(M.title)}">${shape}<text x="${cx + 12}" y="${cy + 4}" fill="var(--fg)" font-size="12" font-weight="700">${esc(M.short)}</text></g>`; });
  return g + '</svg>';
}

/* ============ Panel ============ */
function methodBtn(M){ return `<button class="mbtn" data-m="${M.id}" style="--c:${M.color}"><span class="mn">${esc(M.n)}</span><span><b>${esc(M.title)}</b><span>${esc(M.tag)}</span></span></button>`; }
function demoBtn([l, a]){ return `<button class="try" data-act="${a}">▶ ${esc(l)}</button>`; }
function specs(M){
  const sp = M.s < -1 ? 'Single cells' : M.s < 0.5 ? 'Millimeters' : M.s < 1.3 ? 'About a centimeter' : 'Several centimeters';
  const tm = M.t < -1.5 ? 'Milliseconds' : M.t < 0 ? 'Fractions of a second' : M.t < 1 ? 'Seconds' : M.t < 3 ? 'Minutes' : 'A static map';
  const inv = ['None','Injection','Surgery','Surgery'][M.inv];
  return `<dl class="pairs specs"><div><dt>Reads or writes?</dt><dd><span class="rw" style="--k:${RW[M.rw][0]}">${RW[M.rw][1]}</span></dd></div><div><dt>Spatial detail</dt><dd>${sp}</dd></div><div><dt>Timing</dt><dd>${tm}</dd></div><div><dt>Invasive?</dt><dd>${inv}</dd></div></dl>`;
}
const FM = [
  ['Room A: tag the memory', 'The mouse explores Room A. Hippocampal cells active there are tagged with channelrhodopsin. Nothing scary happens.'],
  ['Room B: light + shock', 'In a different room, blue light reactivates the Room A memory cells while the mouse gets a mild foot shock.'],
  ['Back in Room A: freeze', 'The mouse freezes in fear in Room A, where nothing bad ever happened. A false memory.']
];
function renderPanel(){
  const M = METHODS.find(x => x.id === state.m);
  if (!M){
    panel.style.setProperty('--c', '#f4d27a');
    const main = METHODS.filter(x => !x.more), more = METHODS.filter(x => x.more);
    const q = QUIZ[state.quiz % QUIZ.length];
    panel.innerHTML = `
      <div><div class="eyebrow">Unit 7 · Methods</div><h2>How we study the brain</h2></div>
      <p class="lead">How do we see inside the brain, know what neurons are doing, or excite the brain? By the end, you should be able to tell <b>recording</b> (reading activity) from <b>stimulation</b> (changing it), and pick the right method for a research question.</p>
      <div class="rwkey"><span class="rw" style="--k:#7ad7ff">Records</span><span class="rw" style="--k:#ffb547">Stimulates</span><span class="rw" style="--k:#5fe0a3">Both</span><span class="note">◆ = needs surgery</span></div>
      <figure class="figure chart">${chartSVG()}<figcaption>Each method trades detail for speed. Tap a dot to open it.</figcaption></figure>
      <ul class="mlist">${main.map(x => `<li>${methodBtn(x)}</li>`).join('')}</ul>
      <div class="eyebrow">More methods</div>
      <dl class="pairs">${OTHER.map(([k,v,rw,id]) => `<div><dt><span class="rw" style="--k:${RW[rw][0]}">${esc(k)}</span></dt><dd>${esc(v)}${id ? ` <button class="see3d" data-m="${id}">See it in 3D →</button>` : ''}</dd></div>`).join('')}</dl>
      <section class="quiz" id="quiz" aria-label="Pick the method">
        <div class="eyebrow">Pick the method · ${state.quiz % QUIZ.length + 1} of ${QUIZ.length}</div>
        <p class="q">${esc(q.q)}</p>
        <div class="qopts">${METHODS.filter(x => x.id !== 'lesion' && x.id !== 'calcium').map(x => `<button class="qopt" data-a="${x.id}" ${state.quizPick ? 'disabled' : ''} aria-pressed="${state.quizPick === x.id}">${esc(x.short)}</button>`).join('')}</div>
        ${state.quizPick ? `<p class="qfb ${state.quizPick === q.a ? 'ok' : 'bad'}">${state.quizPick === q.a ? 'Right.' : `Not quite: the best fit is ${esc(METHODS.find(x => x.id === q.a).title)}.`} ${esc(q.why)}</p><button class="btn small primary" id="qnext">Next question →</button>` : ''}
      </section>
      <div class="eyebrow">Problems to keep in mind</div>
      <button class="case" data-card="salmon" style="--c:#ff6fa5"><span class="eyebrow">fMRI</span><span>The dead salmon: why statistics matter</span><span class="case-go">Open →</span></button>
      <button class="case" data-card="fmriproblems" style="--c:#ff6fa5"><span class="eyebrow">fMRI</span><span>Why fMRI results can mislead</span><span class="case-go">Open →</span></button>
      <div class="qa"><div class="q">Can you trust the picture?</div><div class="a">Investigators have found duplicated, rotated and mirrored microscope images of neurons in published papers, including in major journals, traced to an outside lab that supplied the images. Spine counts and statistics are only as good as the raw images behind them. Always ask how an image was made, and whether anyone could check it.</div></div>
      <p class="note">The future: AI is speeding up analysis, and the cost to map a brain is dropping fast.</p>`;
    panel.querySelectorAll('.mbtn,.see3d').forEach(b => b.onclick = () => selectMethod(b.dataset.m));
    panel.querySelectorAll('.pt').forEach(p => { p.onclick = () => selectMethod(p.dataset.m); p.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') selectMethod(p.dataset.m); }; });
    panel.querySelectorAll('.qopt').forEach(b => b.onclick = () => { state.quizPick = b.dataset.a; renderPanel(); $('#quiz').scrollIntoView({block:'nearest'}); });
    const qn = $('#qnext'); if (qn) qn.onclick = () => { state.quiz++; state.quizPick = null; renderPanel(); $('#quiz').scrollIntoView({block:'nearest'}); };
    bindTerms(panel); return;
  }
  const all = M.more ? [M] : METHODS.filter(x => !x.more), i = all.indexOf(M);
  panel.style.setProperty('--c', M.color);
  panel.innerHTML = `
    <button class="back" id="back">← All methods</button>
    <div class="topic-head"><div class="eyebrow">${M.more ? 'More methods' : 'Method ' + esc(M.n)} · ${esc(M.tag)}</div><h2>${esc(M.title)}</h2>${M.long ? `<div class="long">${esc(M.long)}</div>` : ''}</div>
    <div class="mem-line">${esc(M.analogy)}</div>
    <div class="tries">${M.demos.map(demoBtn).join('')}</div>
    ${M.id === 'opto' && OPTO.step ? `<div class="fm" id="fm"><div class="eyebrow">The false-memory experiment · step ${OPTO.step} of 3</div><div class="fm-steps">${FM.map((s,k) => `<div class="fms ${k+1 === OPTO.step ? 'on' : k+1 < OPTO.step ? 'done' : ''}"><b>${k+1}. ${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join('')}</div><div class="row">${OPTO.step < 3 ? '<button class="btn small primary" id="fmNext">Next step →</button>' : '<button class="btn small" data-card="falsememory">Read the study</button>'}</div></div>` : ''}
    ${specs(M)}
    ${M.mn ? `<div class="mn"><div class="mn-title">${esc(M.mn.title)}</div>${M.mn.rows.map(([L,w,d]) => `<div class="mn-row"><span class="L">${esc(L)}</span><div><b>${esc(w)}</b><span class="det">${esc(d)}</span></div></div>`).join('')}</div>` : ''}
    ${M.pairs ? `<dl class="pairs">${M.pairs.map(([k,v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>` : ''}
    <ul class="blist">${M.points.map(p => `<li>${rich(p)}</li>`).join('')}</ul>
    ${M.cases.length ? `<div class="eyebrow">Studies & cases</div><div class="cases">${M.cases.map(([k,t]) => `<button class="case" data-card="${k}"><span class="eyebrow">${esc(CARDS[k].kicker)}</span><span>${esc(t)}</span><span class="case-go">Open →</span></button>`).join('')}</div>` : ''}
    ${M.id === 'opto' ? '<p class="note">See a single neuron respond to blue light in the <a href="neurons.html">Neuron Lab</a>.</p>' : ''}
    <div class="pager"><button class="btn" id="prevM" ${i===0?'disabled':''}>← ${i>0?esc(all[i-1].title):'Back'}</button>
      <button class="btn primary" id="nextM">${i<all.length-1?esc(all[i+1].title)+' →':'All methods'}</button></div>`;
  $('#back').onclick = () => selectMethod(null);
  $('#prevM').onclick = () => i > 0 && selectMethod(all[i-1].id);
  $('#nextM').onclick = () => selectMethod(i < all.length-1 ? all[i+1].id : null);
  panel.querySelectorAll('.try').forEach(b => b.onclick = () => { ACT[b.dataset.act](); refreshTries(); });
  const fn = $('#fmNext'); if (fn) fn.onclick = () => { OPTO.step++; renderPanel(); $('#fm').scrollIntoView({block:'nearest'}); };
  bindTerms(panel); refreshTries();
}

/* ============ Loop ============ */
let last = 0;
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - (last||now))/1000); last = now; T += dt; U.uTime.value = T;
  if (tween){ const k = Math.min(1, (now - tween.t0)/tween.dur), e = ease(k); camera.position.lerpVectors(tween.from, tween.to, e); controls.target.lerpVectors(tween.tf, tween.tt, e); if (k >= 1) tween = null; }
  if (!state.m && !tween) controls.autoRotate = true; else controls.autoRotate = false;
  controls.autoRotateSpeed = 0.5; controls.update();
  if (lh) updScene(dt);
  renderer.render(scene, camera);
  TAGS.forEach(t => { const on = t.group === state.m && (t.group !== 'lesion' || (t.gage ? LES.gage : LES.tan)) && (t.group !== 'dti' || DTI.shown); t.el.style.opacity = on ? 1 : 0; if (on) place(t.el, t.world); });
  drawHud();
}

/* ============ Boot ============ */
resize();
camera.position.set(...VIEWS.home[0]); controls.target.set(...VIEWS.home[1]);
if (isNarrow()) camera.position.multiplyScalar(1.45);
renderPanel();
requestAnimationFrame(frame);
loadCortex().then(() => { buildEcog(); $('#loading').hidden = true; resize(); })
  .catch(err => { $('#loading').textContent = 'The brain model could not load. Reload the page to try again.'; console.error(err); });
</script>
