<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cranial Nerves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a glass head with the 12 nerves and their number-shape pegs on a clock; nerve notes docked right; bottom sheet on phones. */
:root{
  color-scheme: dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0b0e14; --bg-2:#141a27; --panel:#11151e; --raise:#1a2030; --line:#283044;
  --fg:#eceef4; --muted:#a3abbc; --faint:#6e7689; --chalk:#f4d27a;
  --na:#ffb547; --k:#a58bff; --ca:#5fe0a3; --nt:#ff6fa5; --light:#7ad7ff; --hot:#ff7a59;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --panel-w:460px;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}

#stage{position:fixed;inset:0;background:radial-gradient(ellipse 75% 70% at 38% 42%,var(--bg-2) 0%,var(--bg) 72%)}
#stage canvas{display:block;touch-action:none;cursor:grab}
#stage canvas.hovering{cursor:pointer}

.brand{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:20px;z-index:5;pointer-events:none}
.home-link{pointer-events:auto;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.home-link:hover{color:var(--fg)}
.brand-sub{font-size:13px;font-weight:600;color:#ffd166;margin-top:2px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:2px 0 0}

/* scenario chips */
.chips{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);right:calc(var(--panel-w) + 16px);left:300px;z-index:5;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(17,21,30,.78);backdrop-filter:blur(6px);cursor:pointer;font-size:13.5px;white-space:nowrap}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--c,var(--chalk));background:color-mix(in srgb,var(--c,var(--chalk)) 24%,rgba(17,21,30,.9));font-weight:700}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--chalk))}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(17,21,30,.78);backdrop-filter:blur(6px)}
.seg button{border:0;background:none;padding:7px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--chalk);color:#16130a;font-weight:700}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 106px);left:20px;max-width:340px;z-index:5;background:rgba(17,21,30,.92);border:1px solid var(--line);border-left:3px solid var(--c,var(--chalk));border-radius:0 10px 10px 0;padding:10px 12px;font-size:13.5px;color:var(--fg);backdrop-filter:blur(6px)}
.toast b{display:block;font-family:var(--f-display);font-size:15px;margin-bottom:2px}
.toast .term{margin-top:4px;display:inline-block}

/* lab instruments */
.lab{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:5;width:min(420px,calc(100vw - var(--panel-w) - 40px));background:rgba(15,19,28,.9);border:1px solid var(--line);border-radius:14px;padding:14px 16px;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:10px}
.lab-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.readout{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.readout small{font-size:15px;color:var(--muted);font-weight:600;margin-left:3px}
.phase{font-size:13px;color:var(--muted);min-height:20px}
.phase b{color:var(--fg)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.slider-row{display:flex;align-items:center;gap:10px}
input[type=range]{flex:1;accent-color:var(--chalk);height:28px;margin:0}
.btn{padding:9px 15px;border-radius:9px;border:1px solid var(--line);background:var(--raise);cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--chalk);color:#16130a;border-color:var(--chalk)}
.btn.small{padding:6px 11px;font-size:13px}
.states{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.state{padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--faint)}
.state.on{color:#16130a;font-weight:700}
.state.closed.on{background:#8ea3c4}.state.open.on{background:var(--na)}.state.inact.on{background:#ff8f8f}
.state.k.on{background:var(--k)}
#trace{width:100%;height:120px;display:block;border-radius:8px;background:#0b0e14}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}

.mimage{position:fixed;right:calc(var(--panel-w) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:5;width:300px;background:rgba(15,19,28,.9);border:1px solid var(--line);border-radius:14px;padding:12px 14px;backdrop-filter:blur(8px)}
.mimage canvas{width:100%;height:auto;display:block;border-radius:8px;margin-top:6px}
.mimage .cap{font-size:12.5px;color:var(--muted);margin-top:6px}
.mimage h4{margin:2px 0 0;font-family:var(--f-display);font-size:16px}

/* labels on the neuron */
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.plabel{width:max-content;position:absolute;left:0;top:0;transform:translate(-50%,-140%);font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:6px;background:rgba(11,14,20,.85);border:1px solid var(--line);white-space:nowrap;pointer-events:none;transition:opacity .2s}
.plabel.hot{border-color:var(--chalk);color:var(--chalk)}
.plabel.ion{font-weight:400;font-family:var(--f-mono);font-size:11.5px}

/* panel */
#panel{box-sizing:border-box;position:fixed;top:0;right:0;bottom:0;width:var(--panel-w);background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;z-index:6;padding:calc(env(safe-area-inset-top,0px) + 24px) 26px calc(env(safe-area-inset-bottom,0px) + 26px);display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
#panel h2{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.015em;margin:4px 0 0;text-wrap:balance}
#panel p{margin:0;color:var(--fg);max-width:62ch}
#panel .lead{color:var(--muted)}
.topic-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.topic-btn{width:100%;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--raise);cursor:pointer}
.topic-btn:hover{border-color:var(--c)}
.topic-btn .k{font-family:var(--f-mono);font-size:11px;color:var(--c);letter-spacing:.06em}
.topic-btn b{font-family:var(--f-display);font-size:17px}
.back{align-self:flex-start;background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:14px}
.back:hover{color:var(--fg)}
.topic-head .eyebrow{color:var(--c)}
.blist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.blist li::marker{color:var(--c)}
.figure{margin:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;display:flex;flex-direction:column;gap:8px}
.figure img{display:block;width:100%;border-radius:7px;cursor:zoom-in;background:#fff}
.figure.narrow img{width:auto;max-height:300px;margin:0 auto}
.figure figcaption{font-size:12.5px;color:var(--muted)}
.mn{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mn-title{padding:8px 12px;background:color-mix(in srgb,var(--c) 18%,var(--raise));font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.mn-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.mn-row .L{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;color:var(--c);text-align:center}
.mn-row b{font-family:var(--f-display);font-size:16px}
.mn-row .mem{display:block;color:var(--chalk);font-weight:700;font-size:14px}
.mn-row .det{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.pairs{display:grid;grid-template-columns:minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pairs div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.pairs div:first-child{border-top:0}
.see3d{display:inline-block;margin-top:4px;background:none;border:0;padding:0;color:var(--c,#f4d27a);font:inherit;font-weight:700;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.pairs dt{color:var(--muted);margin:0}.pairs dd{margin:0}
.tries{display:flex;flex-wrap:wrap;gap:8px}
.try{border:1px dashed var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);color:var(--fg);padding:8px 13px;border-radius:9px;cursor:pointer;font-weight:700;font-size:13.5px}
.try:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}
.parts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.part{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--raise)}
.part b{display:block;font-size:14px}
.part span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.part:hover,.part:focus-visible{border-color:var(--c)}
.part[aria-pressed="true"]{border-color:var(--chalk);background:color-mix(in srgb,var(--chalk) 14%,var(--raise))}
.case{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;cursor:pointer;border-left:3px solid var(--c);padding:10px 12px;background:rgba(0,0,0,.22);border-radius:0 8px 8px 0;font-size:14px}
.case:hover,.case:focus-visible{background:color-mix(in srgb,var(--c) 14%,rgba(0,0,0,.2))}
.case .eyebrow{color:var(--c)}
.go-card{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--fg);border:1px solid var(--c);border-radius:10px;padding:12px 14px;background:color-mix(in srgb,var(--c) 14%,var(--raise))}
.go-card b{font-family:var(--f-display);font-size:17px}
.go-card:hover{background:color-mix(in srgb,var(--c) 24%,var(--raise))}
.case-go{font-size:12.5px;color:var(--c);font-weight:700;margin-top:2px}
.qa{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.qa .q{font-weight:700}
.qa .a{color:var(--muted);font-size:14px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px}
.note{font-size:12.5px;color:var(--faint)}
.term{all:unset;cursor:pointer;font-weight:700;border-bottom:2px solid var(--c,var(--chalk));padding:0 1px;border-radius:2px;background:color-mix(in srgb,var(--c,var(--chalk)) 14%,transparent)}
.term:hover,.term:focus-visible{background:color-mix(in srgb,var(--c,var(--chalk)) 30%,transparent)}

/* cards */
#card[hidden]{display:none}
#card{position:fixed;inset:0;right:var(--panel-w);z-index:8;display:grid;place-items:center;padding:24px;background:rgba(8,10,14,.55);backdrop-filter:blur(3px)}
.card-sheet{width:min(640px,100%);max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);overscroll-behavior:contain}
.card-top{position:sticky;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 12px;background:var(--panel);border-bottom:1px solid var(--line);z-index:1}
.card-top .eyebrow{color:var(--c)}
.card-top h3{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;margin:3px 0 0;text-wrap:balance}
.close{flex:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--raise);cursor:pointer;font-size:20px;line-height:1}
.card-body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px}
.cfig{margin:0;border-radius:10px;overflow:hidden;border:1px solid var(--line)}.cfig svg{display:block;width:100%;height:auto}.cfig figcaption{font-size:13px;color:var(--muted);padding:8px 12px}
.card-body p{margin:0;max-width:62ch}
.refs{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.refs summary{cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.refs ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
#lightbox[hidden]{display:none}
#lightbox{position:fixed;inset:0;background:rgba(5,7,10,.94);z-index:12;display:grid;place-items:center;padding:24px;cursor:zoom-out}
#lightbox img{max-width:100%;max-height:100%;border-radius:10px;object-fit:contain;background:#fff}
#loading{position:fixed;left:0;right:var(--panel-w);top:46%;text-align:center;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);z-index:1}

.plabel.big{font-size:15px;padding:4px 11px}
.plabel .eyebrow{font-size:10px}
.scene-hud{display:none}
#panel > *{flex-shrink:0}
body[data-scene="bump"] .lab-only, body[data-scene="membrane"] .lab-only{display:none!important}
body[data-scene="membrane"] #memHud, body[data-scene="bump"] #bumpHud{display:flex}
.hud-row{display:flex;flex-wrap:wrap;gap:8px}
.hud-btn{padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--raise);cursor:pointer;font-weight:700;font-size:13.5px}
.hud-btn[aria-pressed="true"]{background:var(--c,var(--chalk));color:#16130a;border-color:var(--c,var(--chalk))}
.hud-btn:hover{border-color:var(--muted)}
.bump-pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bump-pick button{padding:8px 4px;border-radius:9px;border:1px solid var(--line);background:var(--raise);cursor:pointer;text-align:center}
.bump-pick b{display:block;font-family:var(--f-display);font-size:24px;line-height:1;color:var(--c)}
.bump-pick span{font-size:11.5px;color:var(--muted)}
.bump-pick button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--raise))}
.mn-pick{all:unset;box-sizing:border-box;cursor:pointer;width:100%}
.mn-pick:hover .mn-row,.mn-pick:focus-visible .mn-row{background:color-mix(in srgb,var(--c) 10%,transparent)}
.mn-pick[aria-pressed="true"] .mn-row{background:color-mix(in srgb,var(--c) 18%,transparent)}
.mn-hint{font-size:12px;color:var(--faint);padding:6px 12px;border-top:1px solid var(--line)}
@media (max-width:1180px){ .mimage{display:none} }
@media (max-width:820px){
  :root{--panel-w:0px}
  #panel{width:auto;top:auto;left:0;height:46%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 20px)}
  #panel h2{font-size:24px}
  .brand h1{font-size:17px}
  .chips{left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 58px);flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-bottom:4px}
  .toast{display:none}
  .lab{left:10px;right:10px;width:auto;bottom:calc(46% + 8px);padding:10px 12px;gap:7px}
  #trace,.states{display:none}
  .phase{font-size:12.5px}
  .readout{font-size:26px}
  .legend{display:none}
  #card{right:0;padding:0} .card-sheet{border-radius:0;height:100%;max-height:none}
  .pairs div{grid-template-columns:110px minmax(0,1fr)}
  .parts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hud{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:5;width:min(520px,calc(100vw - var(--panel-w) - 40px));background:rgba(15,19,28,.92);border:1px solid var(--line);border-radius:14px;padding:12px 14px;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:8px}
#hudCanvas{width:100%;height:auto;display:block;border-radius:8px}
#hudText{font-size:13.5px;color:var(--muted);min-height:40px}
#hudText b{color:var(--fg)}
.plabel{width:max-content}
.plabel.elec{font-family:var(--f-mono);font-size:10.5px;padding:1px 5px;font-weight:500;background:rgba(11,14,20,.75)}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.mbtn{width:100%;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;padding:10px 13px;border-radius:10px;border:1px solid var(--line);background:var(--raise);cursor:pointer}
.mbtn:hover,.mbtn:focus-visible{border-color:var(--c)}
.mbtn .mn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#0b0e14;font-family:var(--f-display);font-weight:800;font-size:16px}
.mbtn b{display:block;font-family:var(--f-display);font-size:16.5px}
.mbtn span span{display:block;font-size:12.5px;color:var(--muted)}
.rw{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;white-space:nowrap}
.rw::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--k)}
.rwkey{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.chart svg{width:100%;height:auto;display:block}
.chart .pt{cursor:pointer}
.chart .pt:hover text,.chart .pt:focus text{fill:var(--chalk)}
.chart{background:var(--bg)}
.long{color:var(--muted);font-size:14px;margin-top:2px}
.mem-line{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--chalk);line-height:1.3}
.specs dt{color:var(--muted)}
.cases{display:flex;flex-direction:column;gap:8px}
.try[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 30%,transparent);border-style:solid}
.quiz{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--raise)}
.quiz .q{font-weight:700;margin:0}
.qopts{display:flex;flex-wrap:wrap;gap:6px}
.qopt{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700;font-size:13px}
.qopt:hover:not(:disabled){border-color:var(--chalk)}
.qopt[aria-pressed="true"]{background:var(--chalk);color:#16130a}
.qfb{margin:0;font-size:14px}
.qfb.ok{color:#5fe0a3}.qfb.bad{color:#ffb0a0}
.fm{border:1px solid var(--c);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--c) 8%,var(--raise))}
.fm-steps{display:flex;flex-direction:column;gap:6px}
.fms{padding:8px 10px;border-radius:8px;border:1px solid var(--line);opacity:.45;font-size:13.5px}
.fms b{display:block}
.fms.on{opacity:1;border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.fms.done{opacity:.75}
#panel a{color:var(--chalk)}
.qa{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.qa .q{font-weight:700}.qa .a{color:var(--muted);font-size:14px}
@media (max-width:820px){ .hud{left:10px;right:10px;width:auto;bottom:calc(52% + 8px);padding:8px 10px} #hudText{font-size:12.5px;min-height:0} #hudCanvas{max-height:90px;object-fit:contain} }

#stage{background:radial-gradient(ellipse 75% 70% at 40% 40%,#1d2440 0%,#10131f 62%,#0a0b12 100%)}
.plabel b{color:var(--chalk)}
.plabel.peg{font-size:12px;font-weight:600;background:rgba(11,14,20,.78);transition:opacity .3s}
.plabel.peg b{color:var(--chalk);font-size:14px}
#hudCanvas[hidden]{display:none}
.video{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#000}
.video-frame{position:relative;aspect-ratio:16/9}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video figcaption{background:var(--raise);padding:9px 12px;font-size:13px;color:var(--muted)}
.video figcaption b{color:var(--fg)}
.yt-card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-decoration:none;color:#fff;background:radial-gradient(ellipse at center,#2a1420 0%,#0b0e14 75%)}
.yt-card .yt-play{width:74px;height:52px;border-radius:14px;background:#ff0033;display:grid;place-items:center;font-size:26px;box-shadow:0 8px 30px rgba(255,0,51,.35)}
.yt-card .yt-t{font-weight:700;font-size:14px}.yt-card:hover .yt-play{transform:scale(1.06)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters .chip{font-size:12.5px;padding:6px 10px}
.cnlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cnrow{width:100%;display:grid;grid-template-columns:34px 44px minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--raise);cursor:pointer}
.cnrow:hover,.cnrow:focus-visible{border-color:var(--c)}
.cnrow .num{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--c);text-align:center}
.cnrow img{width:44px;height:58px;object-fit:cover;border-radius:6px;display:block}
.cnrow b{font-family:var(--f-display);font-size:16px;margin-right:6px}
.cnrow .shape{display:block;color:var(--chalk);font-size:12.5px;font-weight:700}
.cnrow .fn{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.bignum{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--c);color:#0b0e14;font-size:26px;vertical-align:4px;margin-right:6px}
.hint{font-size:14px;color:var(--muted)}.hint b{color:var(--chalk)}
.poster img{max-height:420px;object-fit:contain;background:#1b1712}

</head><body>

<header class="brand">

  <h1>Cranial nerves</h1>
  <div class="brand-sub">Number → shape → job</div>
</header>
<section class="hud" aria-label="Live readout">
  <div class="eyebrow" id="hudTitle">The 12 cranial nerves</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ============ Cranial nerves (from Professor Freed's Cranial Nerves deck) ============ */
const TYPE = { S:['Sensory','#7ad7ff'], M:['Motor','#ffb547'], B:['Mixed','#c49bff'] };
const ROMAN = ['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
const NERVES = [
  { n:1, name:'Olfactory', type:'S', shape:'Candle', fn:'Smell',
    mn:'A candle in an Old Factory (OLFACTORY) burning so strongly that thick, swirling scent clouds fill the room. People cover their noses.',
    hint:'Smelly Old Factory',
    demos:[['Smell the candle','smell']],
    points:[
      'Detects odor molecules in the nasal cavity. Its axons pass through tiny holes in the skull, the [[cribriform|cribriform plate]], to the olfactory bulb.',
      'Sends smell information straight to the olfactory cortex and limbic structures. That’s why smells are so strongly tied to memory and emotion.',
      'One of the two exceptions: CN I is really part of the <b>CNS</b> ([[cnsexception|why]]).',
      'Locks in: pure incoming smell. No movement, no muscles.'] },
  { n:2, name:'Optic', type:'S', shape:'Swan', fn:'Vision',
    mn:'A swan with enormous, exaggerated eyes (OPTICS), calmly taking in everything around it as light beams enter its eyes.',
    demos:[['Shine light into the eyes','see']],
    points:[
      'Carries visual information from the retina: light, color, shape and motion.',
      'Fibers partly cross at the [[chiasm|optic chiasm]], then travel to the occipital lobe.',
      'Damage causes vision loss, and the pattern depends on where along the pathway the damage is.',
      'Purely about seeing, not moving the eyes. That’s III, IV and VI.',
      'The other CNS exception: the optic nerve is a brain extension, myelinated by oligodendrocytes, so it can get MS lesions ([[cnsexception|why]]).'] },
  { n:3, name:'Oculomotor', type:'M', shape:'Butterfly', fn:'Most eye movements, pupil constriction, raising the eyelid',
    mn:'A butterfly with motorized eyeballs (OCULOMOTOR) on its wings, pushing the eyes up, down, left and right and squeezing the pupils tight.',
    demos:[['Move the eyes (up, down, in)','eyes3'],['Pupil light reflex (II in, III out)','pupil'],['CN III palsy','palsy3']],
    points:[
      'Controls most of the muscles that move the eye, and keeps both eyes aligned.',
      'Raises the upper eyelid.',
      'Carries parasympathetic fibers that constrict the pupil. Shine a light and II brings the signal in, III squeezes the pupil.',
      'Damage ([[palsy3|CN III palsy]]): the eye drifts down and out, the eyelid droops, and the pupil may be wide.'] },
  { n:4, name:'Trochlear', type:'M', shape:'Sailboat', fn:'Moves the eye down and in',
    mn:'A sailboat PULLING (TROCHLEAR) an eyeball down and in, like a rope tightening a sail. Trochlea means “pulley.”',
    demos:[['Look down and in','eyes4']],
    points:[
      'Controls one muscle, the superior oblique, which runs through a pulley-like loop of cartilage (the trochlea).',
      'Moves the eye down and inward: important for reading and walking down stairs.',
      'The only cranial nerve that exits from the back (dorsal side) of the brainstem.',
      'Damage causes double vision looking down; people often tilt their head to compensate.'] },
  { n:5, name:'Trigeminal', type:'B', shape:'Hook (trident)', fn:'Face sensation, chewing',
    mn:'A three-pronged trident hook (TRIGEMINAL) grabs the face, tugging on cheeks and lips, while the jaw below chews aggressively.',
    hint:'Three branches: MOM (Ophthalmic, Maxillary, Mandibular)',
    demos:[['Forehead (V1)','v1'],['Cheek (V2)','v2'],['Jaw (V3)','v3'],['Chew','chew']],
    points:[
      'Brings touch, pain and temperature from the face: one of the main sensory highways of the head.',
      'Three branches (“MOM”): <b>Ophthalmic (V1)</b>, forehead and eye area; <b>Maxillary (V2)</b>, upper face and upper teeth; <b>Mandibular (V3)</b>, lower face and jaw.',
      'V3 also powers the chewing muscles, which makes this a mixed nerve.',
      'Migraine: trigeminal fibers in the brain’s coverings carry much of the headache pain ([[migraine|how]]).'] },
  { n:6, name:'Abducens', type:'M', shape:'Golf club', fn:'Moves the eye outward',
    mn:'A golf club held in someone’s abs (ABDUCENS) smacks an eyeball straight to the side like a golf ball off a tee: left eye left, right eye right.',
    demos:[['Look to the side','eyes6'],['CN VI palsy','palsy6']],
    points:[
      'Controls one muscle, the lateral rectus, which pulls the eye straight outward (abduction).',
      'One simple job: lets you look to the side.',
      'Damage: the eye can’t turn outward, so it drifts in toward the nose, causing double vision when looking to that side.'] },
  { n:7, name:'Facial', type:'B', shape:'Cliff edge', fn:'Facial expression, taste (front 2/3 of the tongue)',
    mn:'A cliff with a face in it (FACIAL), cycling through huge expressions (smiling, crying, grimacing) while food tastes splash onto the tongue.',
    demos:[['Smile','smile'],['Taste: front of the tongue','taste7'],['Bell’s palsy (left side)','bell']],
    points:[
      'Controls the muscles of facial expression: smiling, frowning, raising your eyebrows, closing your eyes.',
      'Carries taste from the <b>front two-thirds</b> of the tongue.',
      'Parasympathetic fibers drive tears and saliva (two of the salivary glands).',
      'Damage ([[bell|Bell’s palsy]]): one whole side of the face droops.'] },
  { n:8, name:'Vestibulocochlear', type:'S', shape:'Hourglass', fn:'Hearing and balance',
    mn:'An hourglass in a VEST with a CONCH shell (VESTIBULOCOCHLEAR), with large ears, walking a tightrope.',
    demos:[['Hear a sound','hear'],['Turn the head (eyes stay steady)','vor']],
    points:[
      'Two branches: <b>cochlear</b> for hearing and <b>vestibular</b> for balance.',
      'Keeps your vision stable when your head moves: the eyes counter-rotate automatically (the [[vor|vestibulo-ocular reflex]]).',
      'Pure perception, no movement output.',
      'Damage: hearing loss, ringing in the ears, dizziness or vertigo.'] },
  { n:9, name:'Glossopharyngeal', type:'B', shape:'Tennis racket', fn:'Taste (back 1/3 of the tongue), swallowing',
    mn:'A glass tennis racket held by Pharrell (GLOSSOPHARYNGEAL) smacks the back of the tongue and throat, triggering taste and a reflexive swallow.',
    demos:[['Taste: back of the tongue','taste9'],['Say “Ah” (damaged left side)','ah']],
    points:[
      'Taste and general sensation from the <b>back third</b> of the tongue, the tonsils and the upper throat.',
      'Helps trigger swallowing and the gag reflex.',
      'Drives saliva from the parotid gland and monitors blood pressure in the neck.',
      'Damage: trouble swallowing, a weak gag reflex, less saliva, and when you say “Ah,” the uvula swings toward the healthy side.'] },
  { n:10, name:'Vagus', type:'B', shape:'Fork & plate', fn:'Rest and digest: heart, lungs, gut',
    mn:'A fork and plate float in Las VEGAS (VAGUS): fork in food (rest and digest), with Parachuting Simpson (parasympathetic) coming in. What happens in Vegas… stays in the body.',
    demos:[['Slow the heart','vagusHeart'],['Turn on digestion','vagusGut']],
    points:[
      'The main nerve of the parasympathetic system, “rest and digest”: it slows the heart, helps control breathing, and runs digestion.',
      'The longest cranial nerve: “vagus” means wandering. It wanders from the brainstem to the heart, lungs and gut.',
      'Also helps with your voice and swallowing.',
      'Connects to the Nervous System unit: it’s the vagus nerve to the middle of the Atomic Sub.'],
    extra:[['img/cn/vegas.jpg','Parachuting into Vegas: rest and digest. From your slides.']] },
  { n:11, name:'Accessory', type:'M', shape:'Two posts (washing line)', fn:'Turns the head, shrugs the shoulders',
    mn:'Two tall posts lift the shoulders in a shrug and twist the head side to side, while the head says “No, I’m not an ACCESSORY to the crime!”',
    demos:[['Shrug','shrug'],['Shake the head “no”','no']],
    points:[
      'Controls the sternocleidomastoid (turns the head) and the trapezius (shrugs the shoulders).',
      'Pure movement nerve.',
      'Partly spinal in origin, so some argue it isn’t a “true” cranial nerve.',
      'Damage: weak shoulder shrug and trouble turning the head against resistance.'] },
  { n:12, name:'Hypoglossal', type:'M', shape:'Clock', fn:'Tongue movement',
    mn:'A clock at 12 o’clock with a small tongue instead of hands (HYPOGLOSSAL), ticking back and forth precisely.',
    demos:[['Stick out the tongue','tongue'],['Damage on the left','tonguePalsy']],
    points:[
      'Controls the tongue’s muscles: fine, precise movement for speech and swallowing.',
      'Motor only.',
      'Damage: stick out your tongue and it points toward the damaged side ([[lick|“lick your wounds”]]).'] }
];
NERVES.forEach(v => { v.id = 'cn' + v.n; v.img = `img/cn/cn${v.n}.jpg`; v.color = TYPE[v.type][1]; });
const NV = Object.fromEntries(NERVES.map(v => [v.id, v]));
const ORDER = ['all', ...NERVES.map(v => v.id)];

const FILTERS = [
  ['Sensory: I, II, VIII', [1,2,8], '#7ad7ff'],
  ['Motor: III, IV, VI, XI, XII', [3,4,6,11,12], '#ffb547'],
  ['Mixed: V, VII, IX, X', [5,7,9,10], '#c49bff'],
  ['Eye movers: III, IV, VI', [3,4,6], '#f4d27a'],
  ['Taste: VII (front), IX (back)', [7,9], '#ff8fb0'],
  ['Parasympathetic powerhouse: X', [10], '#5fe0a3'],
  ['CNS exceptions: I, II', [1,2], '#ffd166']
];

const REFS = {
  kandel:'Kandel, E. R., Koester, J. D., Mack, S. H., & Siegelbaum, S. A. (2021). Principles of Neural Science (6th ed.). McGraw Hill.',
  purves:'Purves, D., et al. (2018). Neuroscience (6th ed.). Oxford University Press.',
  wilson:'Wilson-Pauwels, L., Stewart, P. A., Akesson, E. J., & Spacey, S. D. (2010). Cranial Nerves: Function and Dysfunction (3rd ed.). People’s Medical Publishing House.',
  goadsby:'Goadsby, P. J., et al. (2017). Pathophysiology of migraine: A disorder of sensory processing. Physiological Reviews, 97(2), 553–622.',
  baugh:'Baugh, R. F., et al. (2013). Clinical practice guideline: Bell’s palsy. Otolaryngology–Head and Neck Surgery, 149(3 Suppl), S1–S27.'
};
const CARDS = {
  cribriform:{title:'The cribriform plate', kicker:'CN I', body:['A thin, sieve-like plate of bone in the roof of the nose. Olfactory nerve fibers pass through its tiny holes to reach the olfactory bulb.','A hard blow to the face can fracture it and tear those fibers, causing a lasting loss of smell (anosmia).'], refs:['wilson']},
  cnsexception:{title:'Why CN I and II count as CNS', kicker:'Big exam clue', body:['Cranial nerves III–XII are part of the peripheral nervous system: they connect the brain to muscles, glands and sense organs.','CN I (olfactory) and CN II (optic) are different: they develop as outgrowths of the brain itself. They’re myelinated by oligodendrocytes, not Schwann cells.','So they behave like CNS tissue. The optic nerve, for example, can get MS lesions (optic neuritis).'], refs:['kandel']},
  chiasm:{title:'The optic chiasm', kicker:'CN II', body:['At the chiasm, fibers from the inner (nasal) half of each retina cross to the other side; fibers from the outer half stay on the same side.','Result: each side of the brain sees the opposite half of the visual world. Where the pathway is damaged decides which part of vision is lost.'], refs:['purves']},
  palsy3:{title:'CN III palsy', kicker:'Damage to the oculomotor nerve', body:['With III out, only the trochlear (IV) and abducens (VI) still pull on the eye, so it rests “down and out.”','The upper lid droops (ptosis), and if the pupil fibers are affected, the pupil stays wide and doesn’t react to light.','A sudden CN III palsy with a dilated pupil can signal an aneurysm pressing on the nerve: a medical emergency.'], refs:['wilson']},
  migraine:{title:'How the trigeminal nerve produces migraine pain', kicker:'CN V', body:['The brain tissue itself can’t feel pain, but its coverings (the meninges) can. Trigeminal fibers reach into these coverings and around their blood vessels.','During a migraine attack, these fibers fire and send pain signals to the brainstem, then the thalamus and cortex. Their endings release CGRP, a chemical messenger that amplifies pain signaling. Some newer migraine drugs block CGRP.','As the pathway becomes sensitized, even brushing the scalp can hurt. The trigeminal nerve is a major pain pathway in migraine, but migraine involves more than this one nerve.'], refs:['goadsby']},
  bell:{title:'Bell’s palsy', kicker:'CN VII', body:['A sudden weakness of one side of the face from facial-nerve dysfunction, often with no clear cause.','The whole side droops: the forehead can’t wrinkle, the eye won’t fully close, and the mouth corner sags. Taste on the front of the tongue may change.','Most people recover within weeks to months; steroids given early help.'], refs:['baugh']},
  vor:{title:'The vestibulo-ocular reflex', kicker:'CN VIII', body:['Turn your head while reading this sentence: the words stay steady. Your vestibular system senses the head turn, and the brainstem rotates your eyes the opposite way at the same speed.','It’s one of the fastest reflexes in the body. When the vestibular system is damaged, the world seems to jump or bounce whenever the head moves.'], refs:['purves']},
  lick:{title:'“Lick your wounds”', kicker:'CN XII', body:['Each hypoglossal nerve pushes its half of the tongue forward. If one side is weak, the healthy side pushes harder, so the tongue swings toward the damaged side.','Memory hint: the tongue points toward the injury, as if to lick the wound.'], refs:['wilson']}
};
const QUIZ = [
  {q:'Which nerve carries smell?', a:1}, {q:'You shine a light in one eye and both pupils shrink. Which nerve squeezes the pupils?', a:3},
  {q:'Which nerve moves the eye straight outward?', a:6}, {q:'Taste from the FRONT two-thirds of the tongue?', a:7},
  {q:'Taste from the BACK third of the tongue?', a:9}, {q:'Slows the heart and runs digestion?', a:10},
  {q:'Feeling a touch on your cheek?', a:5}, {q:'Shrugging your shoulders?', a:11},
  {q:'Sticking out your tongue?', a:12}, {q:'Keeping your balance on a tightrope?', a:8},
  {q:'Looking down and in to read or take the stairs?', a:4}, {q:'Seeing color and motion?', a:2}
];

/* ============ Scene: glass head, brain, 12 nerves, 12 peg shapes on a clock ============ */
const V = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);
const lin = h => new THREE.Color(h);
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = s => document.querySelector(s);
const stage = $('#stage'), panel = $('#panel'), labelsEl = $('#labels');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.outputEncoding = THREE.sRGBEncoding; renderer.sortObjects = true; stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 0.05, 100);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.minDistance = 1.5; controls.maxDistance = 22;
scene.add(new THREE.HemisphereLight(0xfff4e6, 0x302848, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.85); sun.position.set(3, 6, 6); scene.add(sun);
const rim = new THREE.DirectionalLight(0xbcd2ff, 0.45); rim.position.set(-5, 2, -5); scene.add(rim);
const std = (c, o={}) => new THREE.MeshStandardMaterial(Object.assign({color:lin(c), roughness:0.55}, o));
const tube = (pts, r, mat, seg=48, rs=8) => new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), seg, r, rs), mat);
const at = (m, p) => (m.position.copy(p), m);
const S = (x,y,z) => V(-x/80, (z-10)/80, (y+18)/80);
const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); const gr = g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.35,'rgba(255,255,255,.55)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); })();
const sprite = (c, s) => { const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex, color:lin(c), transparent:true, depthWrite:false, depthTest:false, blending:THREE.AdditiveBlending})); sp.scale.setScalar(s); return sp; };

const body = new THREE.Group(); scene.add(body);         // shoulders + torso (shrug moves shoulders)
const head = new THREE.Group(); scene.add(head);         // everything that turns with the head
const HEAD_PIVOT = V(0, -1.25, -0.2); head.position.copy(HEAD_PIVOT);
const inHead = new THREE.Group(); inHead.position.copy(HEAD_PIVOT).negate(); head.add(inHead);

/* ---- glass skin ---- */
const zoneU = { uZone:{value:0}, uZoneA:{value:0} };
function headGeo(){
  const g = new THREE.SphereGeometry(1, 96, 72), P = g.attributes.position, zone = new Float32Array(P.count), d = V();
  for (let i=0;i<P.count;i++){ d.fromBufferAttribute(P, i);
    const low = Math.max(0, -d.y - 0.2);
    const sx = 0.93*(1 - 0.42*Math.min(1, low/0.8)), sy = d.y > 0 ? 1.0 : 1.45, sz = d.z > 0 ? 1.15 + 0.28*Math.max(0, -d.y) : 1.2;
    const p = V(d.x*sx, d.y*sy - 0.05, d.z*sz - 0.08);
    if (d.z > 0.55 && d.y < 0.25 && d.y > -0.9) p.z -= 0.04*Math.cos((d.y + 0.3)*3);
    P.setXYZ(i, p.x, p.y, p.z);
    let zn = 0; if (d.z > 0.15){ if (p.y > -0.38) zn = 1; else if (p.y > -0.92) zn = 2; else zn = 3; } if (p.y > 0.55 && d.z < 0.5) zn = 0; if (Math.abs(p.x) > 0.75 && p.y > -0.9) zn = zn === 3 ? 3 : (p.y > -0.38 ? 1 : 0);
    zone[i] = zn; }
  g.setAttribute('zone', new THREE.BufferAttribute(zone, 1)); g.computeVertexNormals(); return g; }
const skinMat = new THREE.MeshStandardMaterial({color:lin('#a9c8ff'), roughness:0.25, metalness:0.05, transparent:true, opacity:0.13, depthWrite:false, side:THREE.FrontSide});
skinMat.onBeforeCompile = sh => { Object.assign(sh.uniforms, zoneU);
  sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nattribute float zone; varying float vZone; varying vec3 vN2; varying vec3 vV2;')
    .replace('#include <begin_vertex>', '#include <begin_vertex>\nvZone = zone;').replace('#include <project_vertex>', '#include <project_vertex>\nvN2 = normalize(normalMatrix*normal); vV2 = normalize(-mvPosition.xyz);');
  sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nuniform float uZone; uniform float uZoneA; varying float vZone; varying vec3 vN2; varying vec3 vV2;')
    .replace('vec4 diffuseColor = vec4( diffuse, opacity );', `
      float fr = pow(1.0 - abs(dot(vN2, vV2)), 2.0);
      bool zon = uZoneA > 0.0 && vZone > 0.5 && (uZone < 0.5 || abs(vZone - uZone) < 0.5);
      vec3 zc = vZone < 1.5 ? vec3(1.0,0.82,0.4) : vZone < 2.5 ? vec3(1.0,0.55,0.75) : vec3(0.55,0.85,1.0);
      vec4 diffuseColor = vec4(zon ? mix(diffuse, zc, 0.85) : diffuse, zon ? 0.55*uZoneA + opacity : opacity + 0.35*fr);`); };
skinMat.customProgramCacheKey = () => 'skin';
const skin = new THREE.Mesh(headGeo(), skinMat); skin.renderOrder = 10; inHead.add(skin);
const neckMat = new THREE.MeshStandardMaterial({color:lin('#a9c8ff'), roughness:0.25, transparent:true, opacity:0.1, depthWrite:false});
const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.42, 1.25, 32, 1, true), neckMat); neck.position.set(0, -1.85, -0.22); body.add(neck);
const shoulders = new THREE.Group(); body.add(shoulders);

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();

  camera.updateMatrixWorld(); ray.setFromCamera(mouse, camera);
